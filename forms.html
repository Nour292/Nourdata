<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Calibri',sans-serif;background:#f0f4f8;min-height:100vh;}
#layout{display:flex;min-height:100vh;}

/* ── Sidebar ── */
#sidebar{width:220px;min-width:220px;background:#1a2b3c;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:width 0.25s,min-width 0.25s;overflow:hidden;}
#sidebar.collapsed{width:52px;min-width:52px;}
#sb-header{display:flex;align-items:center;gap:10px;padding:14px 12px;border-bottom:1px solid rgba(255,255,255,0.08);min-height:58px;}
#sidebar.collapsed #sb-header{padding:14px 0;justify-content:center;}
#sb-logo{width:60px;height:60px;border-radius:50%;object-fit:contain;flex-shrink:0;background:#ffffff;padding:4px;}
#sidebar.collapsed #sb-logo{display:none;}
#sb-title{font-size:14px;font-weight:700;color:#fff;white-space:nowrap;flex:1;line-height:1.3;}
#sb-title small{display:block;font-size:11px;font-weight:400;color:#8fa8c0;}
#sidebar.collapsed #sb-title{opacity:0;width:0;flex:0;}
#sb-toggle{width:30px;height:30px;background:rgba(255,255,255,0.1);border:none;border-radius:6px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:auto;}
#sb-toggle:hover{background:rgba(255,255,255,0.2);}
#sidebar.collapsed #sb-toggle{margin-left:0;width:36px;height:36px;}
#sb-nav{flex:1;padding:4px 0;overflow-y:auto;}

/* ── Groups ── */
.sb-group{border-bottom:1px solid rgba(255,255,255,0.06);}
.sb-group-hdr{display:flex;align-items:center;gap:10px;width:100%;padding:11px 16px;background:none;border:none;color:#8fa8c0;font-size:13px;font-weight:700;cursor:pointer;text-align:left;white-space:nowrap;transition:background 0.15s,color 0.15s;}
.sb-group-hdr:hover{background:rgba(255,255,255,0.05);color:#fff;}
.sb-group-hdr.active-group{color:#fff;}
.sb-arrow{margin-left:auto;font-size:11px;}
.sb-group-items{background:rgba(0,0,0,0.15);}
.sb-item{display:flex;align-items:center;gap:12px;padding:9px 16px 9px 32px;cursor:pointer;color:#b8cfe0;font-size:13px;font-weight:600;border:none;background:none;width:100%;text-align:left;white-space:nowrap;transition:background 0.15s,color 0.15s;}
.sb-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
.sb-item.active{background:rgba(46,134,193,0.22);color:#fff;border-left:3px solid #2e86c1;}
.sb-icon{font-size:16px;flex-shrink:0;width:20px;text-align:center;}
.sb-label{transition:opacity 0.2s;}
#sidebar.collapsed .sb-label{opacity:0;width:0;overflow:hidden;}
#sidebar.collapsed .sb-item{padding:9px 0;justify-content:center;}
#sidebar.collapsed .sb-group-hdr{padding:11px 0;justify-content:center;}
#sidebar.collapsed .sb-group-items{display:none!important;}
#sidebar.collapsed .sb-arrow{display:none;}
#sb-footer{padding:10px;border-top:1px solid rgba(255,255,255,0.08);}
#sb-logout{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.3);border-radius:7px;color:#e74c3c;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;}
#sb-logout:hover{background:rgba(231,76,60,0.28);}
#sidebar.collapsed #sb-logout{justify-content:center;padding:9px;}
#sidebar.collapsed #sb-logout-label{display:none;}

/* ── Main ── */
#main-content{margin-left:220px;flex:1;display:flex;flex-direction:column;min-height:100vh;transition:margin-left 0.25s;background:#f0f4f8;}
body.sb-collapsed #main-content{margin-left:52px;}
#top-header{background:#fff;border-bottom:1px solid #e0e8f0;padding:12px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
#page-title{font-size:18px;font-weight:700;color:#1a2b3c;}
#page-body{padding:24px;flex:1;}

/* ── Form panel ── */
.form-panel{background:#fff;border-radius:14px;padding:28px 32px;max-width:680px;margin:0 auto;box-shadow:0 2px 14px rgba(0,0,0,0.08);border:1px solid #e0e8f0;}
.form-panel-hdr{margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid #e8f0f8;}
.form-panel-hdr h2{font-size:18px;font-weight:700;color:#1a2b3c;margin-bottom:4px;}
.form-panel-hdr p{font-size:12px;color:#7a9ab8;font-weight:600;letter-spacing:1px;text-transform:uppercase;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.form-row.single{grid-template-columns:1fr;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field label{font-size:12px;font-weight:700;color:#5a7a9a;text-transform:uppercase;letter-spacing:0.5px;}
.form-field input{padding:10px 12px;font-size:14px;border:1.5px solid #d0dce8;border-radius:8px;font-family:'Calibri',sans-serif;background:#f7fafd;color:#1a2b3c;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
.form-field input:focus{border-color:#2e86c1;background:#fff;box-shadow:0 0 0 3px rgba(46,134,193,0.12);}
.form-field input[readonly]{background:#eef3f8;color:#4a6a80;cursor:default;}
.form-field input[readonly]:focus{border-color:#d0dce8;box-shadow:none;}
.form-field input.found{border-color:#27ae60!important;background:#f0fff4!important;}
.form-field input.not-found{border-color:#e74c3c!important;background:#fff8f8!important;}
.section-divider{margin:20px 0 14px;padding-bottom:8px;border-bottom:1px solid #e8f0f8;font-size:13px;font-weight:700;color:#2e86c1;text-transform:uppercase;letter-spacing:0.5px;}
.check-group{display:flex;flex-direction:column;gap:8px;}
.check-option{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid #d0dce8;border-radius:8px;cursor:pointer;transition:all 0.15s;background:#f7fafd;}
.check-option:hover{border-color:#2e86c1;background:#f0f8ff;}
.check-option input[type="radio"]{width:16px;height:16px;accent-color:#2e86c1;cursor:pointer;flex-shrink:0;}
.check-option span{font-size:13px;font-weight:600;color:#1a2b3c;}
.check-option.selected{border-color:#2e86c1;background:#dbeafe;}
.form-actions{display:flex;gap:12px;margin-top:28px;justify-content:flex-end;}
.btn-print-form{padding:12px 28px;background:linear-gradient(135deg,#1a6fa8,#2980b9);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Calibri',sans-serif;box-shadow:0 3px 12px rgba(26,111,168,0.4);transition:transform 0.15s,box-shadow 0.15s;}
.btn-print-form:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(26,111,168,0.5);}
.btn-clear-form{padding:12px 22px;background:#f0f4f8;color:#5a7a9a;border:1.5px solid #d0dce8;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Calibri',sans-serif;transition:background 0.15s,color 0.15s;}
.btn-clear-form:hover{background:#e0e8f0;color:#1a2b3c;}
.lookup-hint{font-size:11px;color:#7a9ab8;margin-top:3px;}

/* ── Dark mode ── */
body.dark-mode{background:#1a1a2e!important;}
body.dark-mode #sidebar{background:#0f1923!important;}
body.dark-mode #top-header{background:#1e2d3d!important;border-color:#2a3d50!important;}
body.dark-mode #page-title{color:#e0e0e0!important;}
body.dark-mode #main-content{background:#1a1a2e!important;}
body.dark-mode .form-panel{background:#1e2d3d!important;border-color:#2a3d50!important;box-shadow:0 2px 14px rgba(0,0,0,0.3)!important;}
body.dark-mode .form-panel-hdr{border-color:#2a3d50!important;}
body.dark-mode .form-panel-hdr h2{color:#e0e0e0!important;}
body.dark-mode .form-field label{color:#8fa8c0!important;}
body.dark-mode .form-field input{background:#162330!important;border-color:#2a3f54!important;color:#c8d8e8!important;}
body.dark-mode .form-field input:focus{background:#1a2b3c!important;border-color:#2e86c1!important;}
body.dark-mode .form-field input[readonly]{background:#0d1a24!important;color:#4a6a80!important;}
body.dark-mode .form-field input.found{background:#0d2218!important;border-color:#27ae60!important;}
body.dark-mode .form-field input.not-found{background:#2a1010!important;border-color:#e74c3c!important;}
body.dark-mode .section-divider{border-color:#2a3d50!important;}
body.dark-mode .check-option{background:#162330!important;border-color:#2a3f54!important;}
body.dark-mode .check-option:hover{background:#1a2b3c!important;border-color:#2e86c1!important;}
body.dark-mode .check-option span{color:#c8d8e8!important;}
body.dark-mode .check-option.selected{background:#1a3a5c!important;border-color:#2e86c1!important;}
body.dark-mode .btn-clear-form{background:#1e2d3d!important;color:#8fa8c0!important;border-color:#2a3d50!important;}
body.dark-mode .btn-clear-form:hover{background:#2a3d50!important;color:#e0e0e0!important;}
body.dark-mode .lookup-hint{color:#4a6a80!important;}

/* ── Save toast ── */
#save-toast{position:fixed;bottom:24px;right:24px;padding:10px 20px;border-radius:8px;font-size:13px;font-weight:700;color:#fff;background:#27ae60;z-index:8000;display:none;box-shadow:0 4px 16px rgba(0,0,0,0.2);}
#save-toast.toast-err{background:#e74c3c;}

@media print{#sidebar,#top-header{display:none!important;}#main-content{margin-left:0!important;}}
</style>
</head>
<body>

<div id="layout">

<!-- ── Sidebar ── -->
<aside id="sidebar">
  <div id="sb-header">
    <img src="https://nour292.github.io/Nourdata/nour_energy_logo.png" alt="Logo" id="sb-logo">
    <div id="sb-title">Nour Energy<small>HR System</small></div>
    <button id="sb-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">&#9776;</button>
  </div>
  <nav id="sb-nav">

    <!-- Employee Data -->
    <div class="sb-group">
      <button class="sb-group-hdr" onclick="window.location.href='index.html'">
        <span class="sb-icon">👤</span>
        <span class="sb-label">Employee Data</span>
      </button>
    </div>

    <!-- Job Tracker -->
    <div class="sb-group">
      <button class="sb-group-hdr" onclick="window.location.href='tracker.html'">
        <span class="sb-icon">📋</span>
        <span class="sb-label">Job Tracker</span>
      </button>
    </div>

    <!-- Official Forms (active) -->
    <div class="sb-group">
      <button class="sb-group-hdr active-group" id="btn-grp-forms" onclick="toggleFormsGroup()">
        <span class="sb-icon">📄</span>
        <span class="sb-label">Official Forms</span>
        <span class="sb-arrow" id="arrow-grp-forms">▾</span>
      </button>
      <div class="sb-group-items" id="grp-forms" style="display:block;">
        <button class="sb-item active" onclick="loadForm('housing')">
          <span class="sb-icon">🏠</span>
          <span class="sb-label">Housing Allowance</span>
        </button>
      </div>
    </div>

  </nav>
  <div id="sb-footer">
    <button onclick="toggleDarkMode()" id="sb-dark-btn" style="display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;background:none;border:none;border-bottom:1px solid rgba(255,255,255,0.08);color:#8fa8c0;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:6px;white-space:nowrap;">
      <span id="sb-dark-icon">🌙</span><span class="sb-label" id="sb-dark-label">Dark Mode</span>
    </button>
    <button id="sb-logout" onclick="doLogout()">
      <span>⏻</span><span id="sb-logout-label" class="sb-label">Logout</span>
    </button>
  </div>
</aside>

<!-- ── Main ── -->
<div id="main-content">
  <div id="top-header">
    <div id="page-title">📄 Housing Allowance Request</div>
  </div>
  <div id="page-body">

    <div class="form-panel">
      <div class="form-panel-hdr">
        <h2>🏠 Housing Allowance Request Form</h2>
        <p>QMS-QF-HR-001 &nbsp;·&nbsp; Rev. 3 &nbsp;·&nbsp; 20.02.2023</p>
      </div>

      <!-- Date -->
      <div class="form-row single">
        <div class="form-field">
          <label>Date (التاريخ)</label>
          <input type="text" id="f-date" readonly>
        </div>
      </div>

      <!-- Employee Number -->
      <div class="form-row single">
        <div class="form-field">
          <label>Employee Number &#42;</label>
          <input type="text" id="f-empno" placeholder="Type employee number…" oninput="onEmpInput()" autocomplete="off">
          <span class="lookup-hint" id="emp-hint"></span>
        </div>
      </div>

      <!-- Name + Nationality -->
      <div class="form-row">
        <div class="form-field">
          <label>Name (الاسم)</label>
          <input type="text" id="f-name" readonly placeholder="Auto-filled">
        </div>
        <div class="form-field">
          <label>Nationality (الجنسية)</label>
          <input type="text" id="f-nationality" readonly placeholder="Auto-filled">
        </div>
      </div>

      <!-- Dept -->
      <div class="form-row single">
        <div class="form-field">
          <label>Project / Department</label>
          <input type="text" id="f-dept" readonly placeholder="Auto-filled">
        </div>
      </div>

      <div class="section-divider">Period</div>

      <!-- Start / End dates -->
      <div class="form-row">
        <div class="form-field">
          <label>From Starting Date &#42;</label>
          <input type="date" id="f-start">
        </div>
        <div class="form-field">
          <label>Till Ending Date &#42;</label>
          <input type="date" id="f-end">
        </div>
      </div>

      <div class="section-divider">Housing Allowance Type</div>

      <div class="check-group" id="ha-type-group">
        <label class="check-option" onclick="selectOption(this,'ha-type-group')">
          <input type="radio" name="ha-type" id="f-type1" value="half">
          <span>1/2 Value of housing allowance per contract year<br><small style="color:#7a9ab8;font-weight:500;">(نصف قيمة بدل السكن لكل سنة عقد)</small></span>
        </label>
        <label class="check-option" onclick="selectOption(this,'ha-type-group')">
          <input type="radio" name="ha-type" id="f-type2" value="full">
          <span>Full coverage of housing allowance per contract year<br><small style="color:#7a9ab8;font-weight:500;">(تغطية كاملة لبدل السكن لكل سنة عقد)</small></span>
        </label>
      </div>

      <div class="section-divider">Housing Allowance Details</div>

      <div class="check-group" id="ha-det-group">
        <label class="check-option" onclick="selectOption(this,'ha-det-group')">
          <input type="radio" name="ha-detail" id="f-det1" value="three">
          <span>Three months housing allowance per contract year<br><small style="color:#7a9ab8;font-weight:500;">(ثلاثة أشهر بدل سكن في السنة لكل سنة عقد)</small></span>
        </label>
        <label class="check-option" onclick="selectOption(this,'ha-det-group')">
          <input type="radio" name="ha-detail" id="f-det2" value="two">
          <span>Two months housing allowance per contract year<br><small style="color:#7a9ab8;font-weight:500;">(شهرين بدل سكن في السنة لكل سنة عقد)</small></span>
        </label>
        <label class="check-option" onclick="selectOption(this,'ha-det-group')">
          <input type="radio" name="ha-detail" id="f-det3" value="other">
          <span>Other (أخرى)</span>
        </label>
      </div>

      <div class="form-actions">
        <button class="btn-clear-form" onclick="clearForm()">🗑 Clear</button>
        <button class="btn-print-form" onclick="saveAndPrint()">🖨 Save &amp; Print</button>
      </div>
    </div>

  </div><!-- /page-body -->
</div><!-- /main-content -->

</div><!-- /layout -->

<div id="save-toast"></div>

<script>

const GS_TAB = 'Master File';
let sheetRows = null;

async function loadSheetData() {
  if (sheetRows) return sheetRows;
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${GS_ID}/values/${encodeURIComponent(GS_TAB)}?key=${GS_KEY}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Sheets API error: ' + res.status);
  const data = await res.json();
  sheetRows = (data.values || []).slice(1); // skip header
  return sheetRows;
}

// ── Employee lookup ──
let lookupTimer = null;
function onEmpInput() {
  clearTimeout(lookupTimer);
  lookupTimer = setTimeout(lookupEmp, 350);
}

async function lookupEmp() {
  const empNo = (document.getElementById('f-empno').value || '').trim();
  const inp = document.getElementById('f-empno');
  const hint = document.getElementById('emp-hint');
  if (!empNo) {
    clearEmpFields();
    inp.className = '';
    hint.textContent = '';
    return;
  }
  hint.textContent = 'Looking up…';
  try {
    const rows = await loadSheetData();
    const row = rows.find(r => String(r[0] || '').trim() === empNo);
    if (row) {
      document.getElementById('f-name').value = row[1] || '';
      document.getElementById('f-nationality').value = row[3] || '';
      document.getElementById('f-dept').value = row[4] || '';
      inp.classList.remove('not-found');
      inp.classList.add('found');
      hint.textContent = '✔ Employee found';
      hint.style.color = '#27ae60';
    } else {
      clearEmpFields();
      inp.classList.remove('found');
      inp.classList.add('not-found');
      hint.textContent = '✘ Employee not found';
      hint.style.color = '#e74c3c';
    }
  } catch(e) {
    hint.textContent = 'Could not load employee data.';
    hint.style.color = '#e74c3c';
  }
}

function clearEmpFields() {
  document.getElementById('f-name').value = '';
  document.getElementById('f-nationality').value = '';
  document.getElementById('f-dept').value = '';
}

// ── Radio option highlight ──
function selectOption(el, groupId) {
  document.querySelectorAll('#' + groupId + ' .check-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
}

// ── Clear form ──
function clearForm() {
  document.getElementById('f-empno').value = '';
  document.getElementById('f-empno').className = '';
  document.getElementById('emp-hint').textContent = '';
  clearEmpFields();
  document.getElementById('f-start').value = '';
  document.getElementById('f-end').value = '';
  document.querySelectorAll('input[type="radio"]').forEach(r => r.checked = false);
  document.querySelectorAll('.check-option').forEach(o => o.classList.remove('selected'));
}

// ── Toast ──
function showToast(msg, isErr) {
  const t = document.getElementById('save-toast');
  t.textContent = msg;
  t.className = isErr ? 'toast-err' : '';
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

// ── Date formatting helper ──
function fmtIso(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return String(d.getDate()).padStart(2,'0') + '-' + m[d.getMonth()] + '-' + d.getFullYear();
}

// ── Save & Print ──
function saveAndPrint() {
  const empNo      = (document.getElementById('f-empno').value || '').trim();
  const name       = (document.getElementById('f-name').value || '').trim();
  const nationality= (document.getElementById('f-nationality').value || '').trim();
  const dept       = (document.getElementById('f-dept').value || '').trim();
  const date       = (document.getElementById('f-date').value || '').trim();
  const startIso   = document.getElementById('f-start').value;
  const endIso     = document.getElementById('f-end').value;

  if (!empNo)    { showToast('Please enter Employee Number.', true); return; }
  if (!name)     { showToast('Employee not found. Please check the number.', true); return; }
  if (!startIso) { showToast('Please enter Starting Date.', true); return; }
  if (!endIso)   { showToast('Please enter Ending Date.', true); return; }

  const type1  = document.getElementById('f-type1').checked;
  const type2  = document.getElementById('f-type2').checked;
  const det1   = document.getElementById('f-det1').checked;
  const det2   = document.getElementById('f-det2').checked;
  const det3   = document.getElementById('f-det3').checked;

  const data = {
    date, empNo, name, nationality, dept,
    startDate: fmtIso(startIso),
    endDate: fmtIso(endIso),
    type1, type2, det1, det2, det3
  };

  const html = generatePrintHTML(data);
  const win = window.open('', '_blank', 'width=950,height=750,scrollbars=yes');
  if (!win) { showToast('Popup blocked — please allow popups and try again.', true); return; }
  win.document.write(html);
  win.document.close();
  win.focus();
  // Wait for logo image to load before printing
  win.onload = () => win.print();
  setTimeout(() => { try { win.print(); } catch(e) {} }, 1500);
  showToast('Print preview opened!', false);
}
