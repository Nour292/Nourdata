<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nour Energy Data</title>
<link rel="icon" href="nour_energy_logo.png" type="image/png">
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Calibri', sans-serif; background: #f0f4f8; direction: ltr; }

/* ── App Shell ── */
@media screen {
  #app-shell {
    width: 940px;
    margin: 28px auto 40px;
  }
}

/* ── Top Bar ── */
#top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 22px;
  gap: 20px;
}
#top-bar-left {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}
#top-bar-left h1 {
  font-size: 26px;
  color: #1a5276;
  margin: 0 0 10px 0;
  font-weight: 700;
  letter-spacing: 0.3px;
  line-height: 1.2;
}
#input-row {
  width: 100%;
  margin-bottom: 8px;
}
#employeeNumber {
  font-family: 'Arial Black', sans-serif;
  font-size: 18px;
  padding: 10px 14px;
  border: 2px solid #aaa;
  border-radius: 6px;
  width: 100%;
  height: 46px;
  box-sizing: border-box;
}
#btn-row {
  display: flex;
  gap: 10px;
  width: 100%;
}
#btn-row button {
  flex: 1;
  height: 46px;
  font-family: 'Calibri', sans-serif;
  font-size: 17px;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  padding: 0;
  white-space: nowrap;
}
#searchButton { background: #2e86c1; color: #fff; }
#searchButton:hover { background: #1a5276; }
#deepSearchButton { background: #6c3483; color: #fff; }
#deepSearchButton:hover { background: #512e5f; }
#printButton  { background: #f9e400; color: #111; }
#printButton:hover  { background: #e5d200; }
#clearButton  { background: #e74c3c; color: #fff; }
#clearButton:hover  { background: #c0392b; }

/* ── Logo ──
   Total left height = h1(~32px) + margin(10) + input(46) + margin(8) + buttons(46) = 142px */
#top-bar-right {
  flex-shrink: 0;
  height: 142px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#top-bar-right img {
  height: 142px;
  width: auto;
  display: block;
  object-fit: contain;
}

/* ── Add/Update Button ── */
#dataFormButton { background: #117a65; color: #fff; }
#dataFormButton:hover { background: #0e6655; }

/* ── Inline Tab Row ── */
#tab-row {
  display: flex;
  width: 100%;
  margin-top: 8px;
  border-radius: 6px;
  overflow: hidden;
  border: 2px solid #1a5276;
}
.inline-tab {
  flex: 1;
  height: 40px;
  font-family: 'Calibri', sans-serif;
  font-size: 15px;
  font-weight: 700;
  border: none;
  background: #1a5276;
  color: #fff;
  cursor: pointer;
}
.inline-tab:hover { background: #154360; }

/* ── Inline Search Panel ── */
#inline-search-panel {
  background: #fff;
  border-radius: 0 0 10px 10px;
  box-shadow: 0 3px 18px rgba(0,0,0,0.10);
  padding: 18px 20px 20px;
  margin-top: 0;
  width: 940px;
  box-sizing: border-box;
  margin-bottom: 16px;
}
.ipane { width: 100%; }
#isl-ds-row { display: flex; gap: 10px; margin-bottom: 14px; }
#isl-ds-input {
  flex: 1; padding: 9px 14px; font-size: 15px;
  border: 2px solid #aaa; border-radius: 6px;
}
#isl-ds-row button {
  padding: 9px 22px; font-size: 15px; font-weight: bold;
  background: #2e86c1; color: #fff; border: none;
  border-radius: 6px; cursor: pointer;
}
#isl-ds-row button:hover { background: #1a5276; }
#isl-ds-row { display: flex; gap: 10px; margin-bottom: 14px; }
#isl-deep-input {
  flex: 1; padding: 9px 14px; font-size: 15px;
  border: 2px solid #aaa; border-radius: 6px;
  font-family: 'Calibri', sans-serif;
}
#isl-deep-input:focus { border-color: #2e86c1; outline: none; }
#isl-ds-row button {
  padding: 9px 22px; font-size: 15px; font-weight: bold;
  background: #2e86c1; color: #fff; border: none;
  border-radius: 6px; cursor: pointer;
}
#isl-ds-row button:hover { background: #1a5276; }
#isl-quick-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
#isl-quick-btns button {
  padding: 7px 14px; font-size: 13px; font-weight: 600;
  border: 1px solid #d5e8f5; border-radius: 5px;
  background: #eaf2fb; color: #1a5276; cursor: pointer;
}
#isl-quick-btns button:hover { background: #2e86c1; color: #fff; }
#isl-filter-grid { display: flex; flex-direction: column; gap: 8px; }
#isl-col-picks { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 4px; }
#isl-col-picks label { font-size: 13px; color: #333; cursor: pointer; display: flex; align-items: center; gap: 5px; }
#isl-filter-actions { display: flex; gap: 12px; margin-top: 14px; }
#isl-filter-actions button {
  padding: 9px 22px; font-size: 14px; font-weight: bold;
  border: none; border-radius: 6px; cursor: pointer;
}
#isl-run-btn { background: #1a5276; color: #fff; }
#isl-run-btn:hover { background: #154360; }
#isl-filter-actions button:last-child { background: #e5e7e9; color: #333; }
#isl-ds-result, #isl-list-result { margin-top: 14px; }
.sl-col-ctrl {
  font-size: 12px; font-weight: 600; padding: 3px 10px;
  border: 1px solid #d5e8f5; border-radius: 4px;
  background: #fff; color: #1a5276; cursor: pointer; margin-left: 6px;
}
.sl-col-ctrl:hover { background: #d5e8f5; }
#isl-count-badge {
  font-size: 13px; font-weight: 700; color: #117a65;
  margin-left: 14px; vertical-align: middle;
}
@media screen { #inline-search-panel { width: 100%; } }
@media print { #inline-search-panel, #tab-row { display: none !important; } }

/* ── Data Form Modal ── */
#df-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(10,25,40,0.65);
  z-index: 8888;
  align-items: flex-start;
  justify-content: center;
  padding: 30px 16px;
  overflow-y: auto;
}
#df-modal {
  background: #fff;
  border-radius: 10px;
  width: 100%;
  max-width: 860px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.28);
  padding: 0 0 24px 0;
  margin: auto;
}
#df-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px 24px;
  border-bottom: 2px solid #d5e8f5;
  background: #1a5276;
  border-radius: 10px 10px 0 0;
}
#df-header img { height: 44px; width: auto; }
#df-header span { font-size: 18px; font-weight: 700; color: #fff; flex: 1; }
#df-close {
  background: rgba(255,255,255,0.2); border: none; color: #fff;
  font-size: 18px; font-weight: bold; width: 32px; height: 32px;
  border-radius: 50%; cursor: pointer; line-height: 1;
}
#df-close:hover { background: rgba(255,255,255,0.35); }
#df-pat-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 24px;
  background: #fef9e7;
  border-bottom: 1px solid #f0d080;
}
#df-pat-row label {
  font-size: 13px; font-weight: 700; color: #7d6608;
  white-space: nowrap;
}
#df-pat-input {
  flex: 1; padding: 7px 12px; font-size: 13px;
  border: 1px solid #d4ac0d; border-radius: 5px;
  font-family: monospace;
  background: #fff;
}
#df-pat-input:focus { border-color: #b7950b; outline: none; }
#df-pat-save {
  padding: 7px 16px; font-size: 13px; font-weight: bold;
  background: #117a65; color: #fff; border: none; border-radius: 5px; cursor: pointer; white-space: nowrap;
}
#df-pat-save:hover { background: #0e6655; }
#df-pat-status { font-size: 12px; font-weight: 700; }
#df-tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid #d5e8f5;
  padding: 0 24px;
  background: #eaf2fb;
}
.df-tab {
  padding: 11px 22px;
  font-size: 14px; font-weight: 700;
  border: none; background: none;
  cursor: pointer; color: #555;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
}
.df-tab.active { color: #1a5276; border-bottom-color: #1a5276; background: #fff; }
.df-tab:hover { color: #1a5276; }
#df-update-search { padding: 16px 24px 0; }
#df-search-emp {
  flex: 1; padding: 9px 12px; font-size: 14px;
  border: 2px solid #aaa; border-radius: 6px;
}
#df-load-btn {
  padding: 9px 20px; font-size: 14px; font-weight: bold;
  background: #2e86c1; color: #fff; border: none;
  border-radius: 6px; cursor: pointer;
}
#df-load-btn:hover { background: #1a5276; }
#df-load-msg { font-size: 13px; color: #c0392b; margin-top: 4px; }
#df-fields { padding: 0 24px; }
.df-section-hdr {
  background: #1a5276; color: #fff;
  font-size: 13px; font-weight: 700;
  padding: 5px 10px; margin: 16px 0 10px;
  border-radius: 3px;
}
.df-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px 16px;
}
.df-field { display: flex; flex-direction: column; gap: 3px; }
.df-field label { font-size: 12px; font-weight: 700; color: #1a3a52; }
.df-field input, .df-field select {
  padding: 7px 10px; font-size: 13px;
  border: 1px solid #c8d8e8; border-radius: 5px;
  font-family: 'Calibri', sans-serif;
}
.df-field input:focus, .df-field select:focus {
  border-color: #2e86c1; outline: none;
}
#df-status-msg {
  margin: 14px 0 0;
  font-size: 13px; font-weight: 700;
  min-height: 20px;
}
#df-actions {
  display: flex; gap: 12px; margin-top: 14px;
}
#df-actions button {
  padding: 10px 24px; font-size: 14px; font-weight: bold;
  border: none; border-radius: 6px; cursor: pointer;
}
#df-submit-btn { background: #117a65; color: #fff; }
#df-submit-btn:hover { background: #0e6655; }
#df-actions button:last-child { background: #e5e7e9; color: #333; }
#df-actions button:last-child:hover { background: #ccd; }
@media print { #df-overlay { display: none !important; } }
#logoutButton {
  position: fixed;
  top: 12px;
  right: 18px;
  z-index: 999;
  height: 36px;
  padding: 0 18px;
  background: #c0392b;
  color: #fff;
  font-family: 'Calibri', sans-serif;
  font-size: 14px;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  display: none;
}
#logoutButton:hover { background: #922b21; }
@media print { #logoutButton { display: none !important; } }
#pw-overlay {
  position: fixed; inset: 0;
  background: rgba(15,30,50,0.72);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
#pw-box {
  background: #fff;
  border-radius: 10px;
  padding: 36px 40px 30px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  text-align: center;
  width: 340px;
}
#pw-box img { height: 70px; margin-bottom: 16px; }
#pw-box h2 { font-size: 20px; color: #1a5276; margin: 0 0 6px; }
#pw-box p  { font-size: 13px; color: #777; margin: 0 0 18px; }
#pw-input {
  width: 100%; padding: 10px 14px; font-size: 16px;
  border: 2px solid #c8d8e8; border-radius: 6px;
  margin-bottom: 12px; box-sizing: border-box; text-align: center;
  letter-spacing: 3px;
}
#pw-input:focus { border-color: #2e86c1; outline: none; }
#pw-submit {
  width: 100%; padding: 11px; font-size: 16px; font-weight: bold;
  background: #2e86c1; color: #fff; border: none; border-radius: 6px; cursor: pointer;
}
#pw-submit:hover { background: #1a5276; }
#pw-error { color: #c0392b; font-size: 13px; margin-top: 10px; min-height: 18px; }

/* ── Card ── */
@media screen {
  .card {
    width: 100%;
    max-width: 100%;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 3px 18px rgba(0,0,0,0.13);
    padding: 22px 26px 18px;
    margin: 0 auto;
  }
}
@media print {
  .card {
    width: 100% !important;
    background: #fff !important;
    padding: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    page-break-inside: avoid;
  }
}

/* ── Card Header ── */
.card-hdr {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 2px solid #d5e8f5;
}
.card-hdr img {
  height: 90px;
  width: auto;
}
.card-hdr-text .emp-name {
  font-family: 'Calibri', sans-serif;
  font-size: 24px;
  font-weight: 600;
  color: #1a5276;
  margin: 0;
  line-height: 1.2;
}
.card-hdr-text .emp-num {
  font-size: 18px;
  font-weight: 700;
  color: #555;
  margin: 4px 0 0 0;
}

/* ── Section Headers ── */
.sec-hdr {
  background: #1a5276;
  color: #fff;
  font-size: 13.5px;
  font-weight: 700;
  padding: 5px 10px;
  margin: 14px 0 0 0;
  letter-spacing: 0.4px;
  border-radius: 3px 3px 0 0;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}

/* ── Data Table ── */
.dtbl {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  margin-bottom: 0;
}
.dtbl colgroup col.lbl { width: 150px; }
.dtbl colgroup col.val { width: auto; }
.dtbl td, .dtbl th {
  border: 1px solid #c8d8e8;
  padding: 5px 9px;
  font-size: 13px;
  vertical-align: middle;
  text-align: left;
}
.dtbl .lbl-cell {
  font-weight: 700;
  background: #eaf2fb;
  color: #1a3a52;
  width: 150px;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.dtbl tr:nth-child(even) td:not(.lbl-cell) { background: #f7fbff; }

/* ── Job Ended highlight ── */
.job-ended-cell {
  background: #c0392b !important;
  color: #fff !important;
  font-weight: 700 !important;
  font-size: 15px !important;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.job-ended-badge {
  display: inline-block;
  background: #c0392b;
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  padding: 2px 10px;
  border-radius: 4px;
  margin-left: 10px;
  vertical-align: middle;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}

/* ── Salary total row ── */
.salary-total-row td {
  background: #1e8449 !important;
  color: #fff !important;
  font-weight: 700 !important;
  font-size: 14px !important;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}

/* ── Alerts ── */
.alerts-block {
  margin-top: 14px;
  padding: 10px 14px;
  background: #fdfefe;
  border: 1px solid #c8d8e8;
  border-radius: 0 0 4px 4px;
  font-size: 13px;
}
.alerts-block .alert-item { margin: 3px 0; }
.verdict-line {
  margin-top: 8px;
  font-size: 13.5px;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 4px;
  display: inline-block;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.verdict-green { background: #d5f5e3; color: #1e8449; }
.verdict-yellow { background: #fef9e7; color: #b7950b; }
.verdict-red { background: #fadbd8; color: #c0392b; }

/* ── Footer ── */
.card-footer {
  margin-top: 16px;
  text-align: right;
  font-size: 11px;
  color: #888;
  line-height: 1.6;
}



/* ── Deep Search Results ── */
@media screen {
  .ds-wrap {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 3px 18px rgba(0,0,0,0.13);
    padding: 20px 26px 18px;
  }
}
@media print {
  .ds-wrap {
    width: 100% !important;
    background: #fff !important;
    padding: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    page-break-inside: avoid;
  }
  .ds-tbl { width: 100% !important; font-size: 11.5px; }
  .ds-tbl th { font-size: 11.5px; padding: 3px 8px; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .ds-tbl td { font-size: 11px; padding: 3px 8px; }
  .ds-header { padding-bottom: 8px; margin-bottom: 10px; }
  .ds-header span { display: none !important; }
  .ds-header img { height: 52px !important; display: block !important; }
}
.ds-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid #d5e8f5;
}
.ds-header img { height: 52px; width: auto; }
.ds-header span {
  font-size: 16px;
  font-weight: 700;
  color: #1a5276;
}
.ds-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.ds-tbl th {
  background: #1a5276;
  color: #fff;
  padding: 7px 10px;
  text-align: left;
  font-size: 13px;
  font-weight: 700;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.ds-tbl td {
  border: 1px solid #c8d8e8;
  padding: 6px 10px;
  vertical-align: middle;
}
.ds-tbl tr:nth-child(even) td { background: #f7fbff; }
.ds-tbl tr:hover td { background: #eaf4fb; cursor: pointer; }
.ds-count {
  font-size: 12px;
  color: #888;
  margin-top: 8px;
  text-align: right;
}
.ds-match {
  background: #fef9e7 !important;
  font-weight: 700;
  color: #1a5276;
}
.no-print { display: block; }
@media print { .no-print { display: none !important; } }
#card-area:empty::after {
  content: 'Enter an Employee Number above and press Search.';
  display: block;
  text-align: center;
  color: #aaa;
  font-size: 15px;
  padding: 60px 0;
}

@media print {
  @page { margin: 10mm; size: A4; }
  html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; width: 100% !important; }
  #app-shell { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
  #card-area { width: 100% !important; margin: 0 !important; padding: 0 !important; }

  .salary-total-row td { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .alerts-block { font-size: 11.5px; padding: 6px 10px; }
  .verdict-line { font-size: 12px; padding: 3px 8px; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .card-footer { font-size: 10px; margin-top: 10px; }
}

/* ── Search & Lists Modal ── */
#sl-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(10,25,40,0.65);
  z-index: 7777; align-items: flex-start;
  justify-content: center; padding: 24px 16px; overflow-y: auto;
}
#sl-modal {
  background: #fff; border-radius: 10px;
  width: 100%; max-width: 1100px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.28);
  margin: auto; overflow: hidden;
}
#sl-header {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 24px; background: #1a5276;
  border-radius: 10px 10px 0 0;
}
#sl-header img { height: 40px; width: auto; }
#sl-header span { font-size: 17px; font-weight: 700; color: #fff; flex: 1; }
#sl-close {
  background: rgba(255,255,255,0.2); border: none; color: #fff;
  font-size: 17px; font-weight: bold; width: 30px; height: 30px;
  border-radius: 50%; cursor: pointer;
}
#sl-close:hover { background: rgba(255,255,255,0.35); }

/* 50/50 tab row */
#sl-tabs {
  display: flex; border-bottom: 2px solid #d5e8f5; background: #eaf2fb;
}
.sl-tab {
  flex: 1; padding: 12px 0; font-size: 14px; font-weight: 700;
  border: none; background: none; cursor: pointer; color: #555;
  border-bottom: 3px solid transparent; margin-bottom: -2px;
  text-align: center;
}
.sl-tab.active { color: #1a5276; border-bottom-color: #1a5276; background: #fff; }
.sl-tab:hover { color: #1a5276; }

/* Body — single pane takes full width */

<script>
/* ─── Column index map — Google Sheet Row 1 headers ─── */
const COL = {
  empNum:        0,   // Employee Number
  name:          1,   // Names
  mobile:        2,   // Mobile Number
  nationality:   3,   // Nationality
  jobTitle:      4,   // Job Title
  location:      5,   // Location
  actualLocation:6,   // Actual Location
  joiningDate:   7,   // Joining Date
  serviceDays:   8,   // Service Days
  serviceCont:   9,   // Service Y,M,D
  dob:           10,  // DOB

  age:           12,  // Age Y,M,D
  total:         13,  // Total
  basic:         14,  // Basic
  food:          15,  // Food

  otherTrasp:    18,  // Other Trasp
  housing25:     19,  // Housing 25%
  housing:       20,  // Housing
  transpStatus:  21,  // Trasp Status
  medical:       22,  // Medical
  contract:      23,  // Contract
  annualLeave:   24,  // Annual Leave
  tickets:       25,  // Tickets

  status:        28,  // Status

  idNo:          30,  // Id No
  idProfession:  31,  // Id Profession
  idExpHijri:    32,  // Id Exp - Hijri
  idExpGreg:     33,  // Id Exp - Gregorian
  idRemDays:     34,  // ID - Remaining Days
  ppNumber:      35,  // PP number
  issuePlace:    36,  // Issue Place
  issueDate:     37,  // Issue date
  ppExpiry:      38,  // Expiry date
  ppRemDays:     39,  // PP-Remaining Days
  jobEnded:      40,  // Job Ended
  serviceEndDays:41,  // Total Service Days
  serviceEnded:  42,  // Total Service Y,M,D
  iban:          43,  // IBAN
  email:         44,  // EMAIL
};

/* ─── Google Sheets Config ─── */
const GS_ID    = '16QYl00ATXVIlQKkqRxdAIdU6J3u7lDfg0PIoJfaDBpo';
const GS_TAB   = 'Master File';
const GS_KEY   = 'AIzaSyBfjtlvDvGxmS1OcqFVGNMMadqza1ofCrI';
const GS_URL   = `https://sheets.googleapis.com/v4/spreadsheets/${GS_ID}/values/${encodeURIComponent(GS_TAB)}?key=${GS_KEY}`;
const GS_WRITE = 'https://script.google.com/macros/s/AKfycbzGXoDV-fdif6qiP_wFjmoULC0pXoRDVsH1P_-LptWEAIwYC3NBzDo-aWwOr4OXoaVuxQ/exec';

/* Load rows from Google Sheets — returns array of arrays (row 0 = headers) */
async function loadSheetRows() {
  if (csvRows) return csvRows;
  const res  = await fetch(GS_URL);
  if (!res.ok) throw new Error(`Sheets API error: ${res.status}`);
  const data = await res.json();
  csvRows = data.values || [];
  return csvRows;
}

/* ─── Access Level ─── */
// 'none' = not logged in | 'employee' = standard access | 'admin' = full access
let currentAccessLevel = 'none';
let csvRows = null;

// Password hashes (SHA-256) — do not store plain passwords here
const PW_ADMIN     = '2d8f693a554950343de320b8789f03563e1291bde42cdab4658cae4be8654f1b';
const PW_EMP_1     = 'a2c2bc574f1171703f07c2a44eb792452f9f9354666d866a420da17d5bf4f020';
const PW_EMP_2     = 'd4e2501734145318e12b209000cf646434ff9d3fae8bc9302dba2d7ce01f3073';

async function hashPassword(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}

async function checkPassword() {
  const entered = document.getElementById('pw-input').value.trim();
  if (!entered) { document.getElementById('pw-error').textContent = 'Please enter your password.'; return; }

  const hashed = await hashPassword(entered);

  if (hashed === PW_ADMIN) {
    currentAccessLevel = 'admin';
    unlockApp();
    return;
  }

  if (hashed === PW_EMP_1 || hashed === PW_EMP_2) {
    currentAccessLevel = 'employee';
    unlockApp();
    return;
  }

  document.getElementById('pw-error').textContent = 'Access denied. Invalid password.';
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-input').focus();
}

function unlockApp() {
  document.getElementById('pw-overlay').style.display = 'none';
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').textContent = '';
  document.getElementById('logoutButton').style.display = 'block';
  const isAdmin = currentAccessLevel === 'admin';
  document.getElementById('dataFormButton').style.display = isAdmin ? 'block' : 'none';
  document.getElementById('tab-row').style.display        = isAdmin ? 'flex'  : 'none';
  document.getElementById('inline-search-panel').style.display = 'none';
  document.getElementById('employeeNumber').focus();
}

/* ─── Logout ─── */
function logout() {
  currentAccessLevel = 'none';
  csvRows = null;
  clearCard();
  document.getElementById('logoutButton').style.display   = 'none';
  document.getElementById('dataFormButton').style.display = 'none';
  document.getElementById('tab-row').style.display        = 'none';
  document.getElementById('inline-search-panel').style.display = 'none';
  inlineCurrentTab = 'deep';
  document.getElementById('pw-overlay').style.display = 'flex';
  document.getElementById('pw-input').focus();
}

/* ─── Deep Search ─── */

// All searchable columns with their label and COL key
const DS_ALL_COLS = [
  { key: 'empNum',       label: 'Emp No',            idx: 0  },
  { key: 'name',         label: 'Name',               idx: 1  },
  { key: 'mobile',       label: 'Mobile',             idx: 2  },
  { key: 'nationality',  label: 'Nationality',        idx: 3  },
  { key: 'jobTitle',     label: 'Job Title',          idx: 4  },
  { key: 'location',     label: 'Location',           idx: 5  },
  { key: 'joiningDate',  label: 'Joining Date',       idx: 7  },
  { key: 'serviceCont',  label: 'Service',            idx: 9  },
  { key: 'dob',          label: 'Date of Birth',      idx: 10 },
  { key: 'age',          label: 'Age',                idx: 12 },
  { key: 'total',        label: 'Total Salary',       idx: 13 },
  { key: 'basic',        label: 'Basic Salary',       idx: 14 },
  { key: 'food',         label: 'Food Allowance',     idx: 15 },
  { key: 'other',        label: 'Other',              idx: 16 },
  { key: 'trPct',        label: 'Transport 10%',      idx: 17 },
  { key: 'otherTrasp',   label: 'Other Transport',    idx: 18 },
  { key: 'housing25',    label: 'Housing 25%',        idx: 19 },
  { key: 'housing',      label: 'Housing',            idx: 20 },
  { key: 'medical',      label: 'Medical',            idx: 22 },
  { key: 'contract',     label: 'Contract',           idx: 23 },
  { key: 'annualLeave',  label: 'Annual Leave',       idx: 24 },
  { key: 'tickets',      label: 'Tickets',            idx: 25 },
  { key: 'qiwaStart',    label: 'Qiwa Start',         idx: 26 },
  { key: 'qiwaEnd',      label: 'Qiwa Ending',        idx: 27 },
  { key: 'status',       label: 'Status',             idx: 28 },
  { key: 'idNo',         label: 'ID No',              idx: 30 },
  { key: 'idProfession', label: 'ID Profession',      idx: 31 },
  { key: 'idExpGreg',    label: 'ID Expiry',          idx: 33 },
  { key: 'idRemDays',    label: 'ID Remaining Days',  idx: 34 },
  { key: 'ppNumber',     label: 'Passport No',        idx: 35 },
  { key: 'ppExpiry',     label: 'Passport Expiry',    idx: 38 },
  { key: 'jobEnded',     label: 'Job Ended',          idx: 40 },
  { key: 'maritalStatus',label: 'Marital Status',     idx: 41 },
  { key: 'serviceEnded', label: 'Service Ended',      idx: 42 },
  { key: 'iban',         label: 'IBAN',               idx: 43 },
  { key: 'email',        label: 'Email',              idx: 44 },
];

// Fixed columns always shown (if match is one of these, no extra column added)
const DS_FIXED = [
  { label: 'Emp No',    idx: COL.empNum   },
  { label: 'Name',      idx: COL.name     },
  { label: 'Mobile',    idx: COL.mobile   },
  { label: 'Job Title', idx: COL.jobTitle },
];
const DS_FIXED_IDX = new Set(DS_FIXED.map(c => c.idx));

function deepSearch() {
  const query = document.getElementById('employeeNumber').value.trim().toLowerCase();
  if (!query) { alert('Type something in the search box first.'); return; }

  const doSearch = (rows) => {
    const header = rows[0] || [];

    // Match against all columns — exclude job-ended employees
    const results = [];
    rows.slice(1).forEach(r => {
      // Skip if job ended
      const jobEndedVal = (r[COL.jobEnded] || '').trim();
      if (jobEndedVal !== '' && jobEndedVal !== '—') return;

      const matchedCols = [];
      DS_ALL_COLS.forEach(col => {
        const cell = (r[col.idx] || '').toLowerCase();
        if (cell.includes(query)) matchedCols.push(col);
      });
      if (matchedCols.length > 0) results.push({ r, matchedCols });
    });

    if (results.length === 0) {
      document.getElementById('card-area').innerHTML =
        `<p style="text-align:center;color:#c0392b;padding:40px 0;font-size:15px;">No results found for "<strong>${query}</strong>".</p>`;
      return;
    }

    // Determine extra columns: matched columns NOT already in fixed set
    const extraColKeys = new Set();
    results.forEach(({ matchedCols }) => {
      matchedCols.forEach(col => {
        if (!DS_FIXED_IDX.has(col.idx)) extraColKeys.add(col.key);
      });
    });
    const extraCols = DS_ALL_COLS.filter(c => extraColKeys.has(c.key));

    // Build table
    let html = `<div class="ds-wrap">`;

    // Header: logo left + title
    html += `<div class="ds-header">
      <img src="nour_energy_logo.png" alt="Logo" onerror="this.style.display='none'">
      <span>Deep Search — "<em>${query}</em>" &nbsp;·&nbsp; ${results.length} record${results.length !== 1 ? 's' : ''} found</span>
    </div>`;

    // Table header
    html += `<table class="ds-tbl"><thead><tr>`;
    DS_FIXED.forEach(c => { html += `<th>${c.label}</th>`; });
    extraCols.forEach(c => { html += `<th>${c.label}</th>`; });
    html += `</tr></thead><tbody>`;

    // Rows
    results.forEach(({ r, matchedCols }) => {
      const matchedIdxSet = new Set(matchedCols.map(c => c.idx));
      html += `<tr onclick="loadCardByEmpNum('${(r[COL.empNum]||'').trim().replace(/'/g,"\\'")}')">`;
      DS_FIXED.forEach(c => {
        const val = v(r[c.idx]);
        const hi  = matchedIdxSet.has(c.idx) ? ' ds-match' : '';
        html += `<td class="${hi}">${c.idx === COL.name ? rtlWrap(val) : val}</td>`;
      });
      extraCols.forEach(c => {
        const val = v(r[c.idx]);
        const hi  = matchedIdxSet.has(c.idx) ? ' ds-match' : '';
        html += `<td class="${hi}">${val}</td>`;
      });
      html += `</tr>`;
    });

    html += `</tbody></table>`;

    // Footer same as card
    html += `<div class="card-footer">Printed: ${todayStr()}<br>Created by: Qasim</div>`;
    html += `</div>`;

    document.getElementById('card-area').innerHTML = html;
  };

  if (csvRows) {
    doSearch(csvRows);
  } else {
    loadSheetRows()
      .then(rows => doSearch(rows))
      .catch(err => {
        document.getElementById('card-area').innerHTML =
          `<p style="text-align:center;color:#c0392b;padding:40px 0;">Failed to load data — ${err.message}</p>`;
      });
  }
}

/* ─── Load full card by clicking a Deep Search row ─── */
function loadCardByEmpNum(empNum) {
  if (!csvRows) return;
  const found = csvRows.slice(1).find(r => (r[COL.empNum]||'').trim() === empNum);
  if (found) {
    document.getElementById('card-area').innerHTML = renderCard(found, currentAccessLevel);
  }
}

/* ─── Print Card — sets PDF filename ─── */
function printCard() {
  const card = document.querySelector('.card');
  const empNumEl = card ? card.querySelector('.emp-num') : null;
  const empNum = empNumEl ? empNumEl.textContent.trim() : 'Employee';
  const prevTitle = document.title;
  document.title = `${empNum} - Employee card`;
  window.print();
  setTimeout(() => { document.title = prevTitle; }, 1000);
}
function clearCard() {
  document.getElementById('card-area').innerHTML = '';
  document.getElementById('employeeNumber').value = '';
  document.getElementById('employeeNumber').focus();
}

/* ─── Enter key ─── */
document.getElementById('pw-input').addEventListener('keyup', e => {
  if (e.key === 'Enter') checkPassword();  // async — handled automatically
});
/* Enter key handled in DOMContentLoaded below */

/* ─── Helpers ─── */
function v(val) {
  if (!val || val.trim() === '' || val.trim() === 'N/A') return '—';
  return val.trim();
}

function rtlWrap(val) {
  // Wrap Arabic/RTL text
  if (/[\u0600-\u06FF]/.test(val)) return `<span dir="rtl">${val}</span>`;
  return val;
}

function parseDate(str) {
  if (!str || str.trim() === '' || str.trim() === '—') return null;
  const s = str.trim();
  // Try DD/MM/YYYY or YYYY-MM-DD
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function daysDiff(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}

function alertEmoji(days) {
  if (days === null) return null;
  if (days < 0)  return '🔴';
  if (days <= 30) return '🟠';
  if (days <= 90) return '🟡';
  return '🟢';
}

function fmtDate(str) { return v(str); }

function todayStr() {
  const d = new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(d.getDate()).padStart(2,'0')}-${months[d.getMonth()]}-${d.getFullYear()}`;
}

/* ─── Parse CSV (handles quoted commas) ─── */
function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim() !== '');
  return lines.map(line => {
    const cells = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cells.push(cur); cur = ''; }
      else { cur += ch; }
    }
    cells.push(cur);
    return cells;
  });
}

/* ─── Render Card ─── */
function renderCard(cells, accessLevel) {
  const isAdmin = accessLevel === 'admin';
  const get = idx => (cells[idx] || '').trim();

  const name      = get(COL.name);
  const empNum    = get(COL.empNum);
  const jobEnded  = get(COL.jobEnded);
  const isEnded   = jobEnded !== '' && jobEnded !== '—';
  const service   = isEnded ? get(COL.serviceEnded) : get(COL.serviceCont);

  /* ── Header ── */
  let html = `<div class="card">`;
  html += `<div class="card-hdr">
    <img src="nour_energy_logo.png" alt="Logo" onerror="this.style.display='none'">
    <div class="card-hdr-text">
      <p class="emp-name">${rtlWrap(v(name))}${isEnded ? `<span class="job-ended-badge">JOB ENDED</span>` : ''}</p>
      <p class="emp-num">${v(empNum)}</p>
    </div>
  </div>`;

  /* ── Personal & Employment ── */
  html += `<div class="sec-hdr">Personal &amp; Employment</div>`;
  html += `<table class="dtbl"><colgroup><col class="lbl"><col class="val"><col class="lbl"><col class="val"></colgroup><tbody>`;

  function row2(l1, v1, l2, v2, opts={}) {
    const c1 = opts.red1 ? ' job-ended-cell' : '';
    const c2 = opts.red2 ? ' job-ended-cell' : '';
    return `<tr>
      <td class="lbl-cell">${l1}</td><td class="${c1}">${rtlWrap(v(v1))}</td>
      <td class="lbl-cell">${l2}</td><td class="${c2}">${rtlWrap(v(v2))}</td>
    </tr>`;
  }
  function row1(l1, v1, opts={}) {
    const c1 = opts.red1 ? ' job-ended-cell' : '';
    return `<tr>
      <td class="lbl-cell">${l1}</td><td colspan="3" class="${c1}">${rtlWrap(v(v1))}</td>
    </tr>`;
  }

  html += row2('Job Title', get(COL.jobTitle), 'Location', get(COL.location));
  html += row2('Nationality', get(COL.nationality), 'Mobile', get(COL.mobile));
  html += row2('Date of Birth', get(COL.dob), 'Age', get(COL.age));

  if (isEnded) {
    html += row2('Joining Date', get(COL.joiningDate), 'Job Ended', get(COL.jobEnded), {red2: true});
    html += row2('Contract', get(COL.contract), 'Total Service (Y,M,D)', service);
    html += row2('Annual Leave', get(COL.annualLeave), 'Tickets', get(COL.tickets));
    html += row2('Medical', get(COL.medical), 'Marital Status', get(COL.maritalStatus));
    html += row1('Email', get(COL.email));
    html += row1('IBAN', get(COL.iban));
  } else {
    html += row2('Joining Date', get(COL.joiningDate), 'Service', service);
    html += row2('Contract', get(COL.contract), 'Annual Leave', get(COL.annualLeave));
    html += row2('Tickets', get(COL.tickets), 'Medical', get(COL.medical));
    html += row2('Marital Status', get(COL.maritalStatus), 'Email', get(COL.email));
    html += row1('IBAN', get(COL.iban));
  }

  html += `</tbody></table>`;

  /* ── Salary (admin only) ── */
  if (isAdmin) {
    html += `<div class="sec-hdr">Salary (SAR)</div>`;
    html += `<table class="dtbl"><colgroup><col class="lbl"><col class="val"><col class="lbl"><col class="val"></colgroup><tbody>`;
    html += row2('Basic', get(COL.basic), 'Food', get(COL.food));
    html += row2('Other', get(COL.other), 'Housing 25%', get(COL.housing25));
    html += row2('Transport 10%', get(COL.trPct), 'Other Transport', get(COL.otherTrasp));
    html += `<tr class="salary-total-row">
      <td class="lbl-cell" style="color:#fff;background:#1e8449;">Total Salary</td>
      <td colspan="3" style="font-weight:700;font-size:15px;">${v(get(COL.total))} SAR</td>
    </tr>`;
    html += `</tbody></table>`;
  }

  /* ── IDs & Documents ── */
  html += `<div class="sec-hdr">IDs &amp; Documents</div>`;
  html += `<table class="dtbl"><colgroup><col class="lbl"><col class="val"><col class="lbl"><col class="val"></colgroup><tbody>`;
  html += row2('ID No', get(COL.idNo), 'ID Profession', get(COL.idProfession));
  html += row2('ID Exp (Gregorian)', get(COL.idExpGreg), 'ID Remaining Days', get(COL.idRemDays));
  html += row2('Qiwa Start', get(COL.qiwaStart), 'Qiwa Ending', get(COL.qiwaEnd));
  html += row2('Passport No', get(COL.ppNumber), 'PP Expiry', get(COL.ppExpiry));
  html += `</tbody></table>`;

  /* ── Alerts ── */
  html += `<div class="alerts-block">`;

  if (isEnded) {
    html += `<p style="color:#888;margin:0;">🔴 File is closed — ${v(jobEnded)}</p>`;
  } else {
    const checks = [
      { label: 'Iqama (ID)',   dateVal: get(COL.idExpGreg),  remDays: get(COL.idRemDays) },
      { label: 'Passport',     dateVal: get(COL.ppExpiry),   remDays: null },
      { label: 'Qiwa',         dateVal: get(COL.qiwaEnd),    remDays: null },
    ];

    let alertItems = [];
    let worstLevel = 0; // 0=clear,1=yellow,2=orange,3=red

    checks.forEach(ch => {
      let days;
      if (ch.remDays && ch.remDays !== '—' && !isNaN(+ch.remDays)) {
        days = +ch.remDays;
      } else {
        days = daysDiff(ch.dateVal);
      }
      const emoji = alertEmoji(days);
      if (!emoji || emoji === '🟢') {
        if (days !== null) worstLevel = Math.max(worstLevel, 0);
        return;
      }
      const level = emoji === '🔴' ? 3 : emoji === '🟠' ? 2 : 1;
      worstLevel = Math.max(worstLevel, level);
      const daysLabel = days === null ? '' : days < 0 ? ` (${Math.abs(days)}d overdue)` : ` (${days}d left)`;
      alertItems.push(`<div class="alert-item">${emoji} <strong>${ch.label}</strong> — ${fmtDate(ch.dateVal)}${daysLabel}</div>`);
    });

    if (alertItems.length === 0) {
      html += `<div class="alert-item">🟢 All documents checked — no immediate alerts.</div>`;
    } else {
      html += alertItems.join('');
    }

    const verdictClass = worstLevel >= 3 ? 'verdict-red' : worstLevel >= 2 ? 'verdict-yellow' : worstLevel >= 1 ? 'verdict-yellow' : 'verdict-green';
    const verdictText  = worstLevel >= 3 ? '🔴 Document Health: URGENT' : worstLevel >= 2 ? '🟠 Document Health: Attention' : worstLevel >= 1 ? '🟡 Document Health: Attention' : '🟢 Document Health: Clear';
    html += `<div class="verdict-line ${verdictClass}">${verdictText}</div>`;
  }

  html += `</div>`; // alerts-block

  /* ── Footer ── */
  html += `<div class="card-footer">
    Printed: ${todayStr()}<br>
    Created by: Qasim
  </div>`;

  html += `</div>`; // .card
  return html;
}

/* ─── Search Employee ─── */
function searchEmployee() {
  const query = document.getElementById('employeeNumber').value.trim();
  if (!query) { alert('Please enter an Employee Number or ID No.'); return; }

  document.getElementById('card-area').innerHTML = '<p style="text-align:center;color:#888;padding:40px 0;">Loading…</p>';

  const doSearch = (rows) => {
    let found = null;
    for (let i = 1; i < rows.length; i++) {
      const cells = rows[i];
      const empNum = (cells[COL.empNum] || '').trim();
      const idNo   = (cells[COL.idNo]   || '').trim();
      if (empNum === query || idNo === query) { found = cells; break; }
    }
    if (!found) {
      const nums = rows.slice(1).map(r => (r[COL.empNum]||'').trim()).filter(n => n);
      const close = nums
        .map(n => ({ n, diff: Math.abs(+n - +query) }))
        .sort((a,b) => a.diff - b.diff)
        .slice(0,3).map(x => x.n);
      document.getElementById('card-area').innerHTML =
        `<p style="text-align:center;color:#c0392b;padding:40px 0;font-size:15px;">
          Employee not found for "<strong>${query}</strong>".
          ${close.length ? `<br>Closest matches: <strong>${close.join(', ')}</strong>` : ''}
        </p>`;
      return;
    }
    document.getElementById('card-area').innerHTML = renderCard(found, currentAccessLevel);
  };

  if (csvRows) { doSearch(csvRows); }
  else {
    loadSheetRows()
      .then(rows => doSearch(rows))
      .catch(err => {
        document.getElementById('card-area').innerHTML =
          `<p style="text-align:center;color:#c0392b;padding:40px 0;">Failed to load data — ${err.message}</p>`;
      });
  }

  document.getElementById('employeeNumber').value = '';
}

</script>

<script>
/* ════════════════════════════════════════
   DATA FORM — GitHub API Read / Write
════════════════════════════════════════ */
/* ─── GitHub constants removed — now using Google Sheets ─── */

let dfCurrentTab = 'add';
let dfEditRowIdx = -1;

const FORM_FIELDS = [
  { id:'f-empNum',       idx: 0  },
  { id:'f-name',         idx: 1  },
  { id:'f-mobile',       idx: 2  },
  { id:'f-nationality',  idx: 3  },
  { id:'f-jobTitle',     idx: 4  },
  { id:'f-location',     idx: 5  },
  { id:'f-joiningDate',  idx: 7  },
  { id:'f-dob',          idx: 10 },
  { id:'f-total',        idx: 13 },
  { id:'f-basic',        idx: 14 },
  { id:'f-food',         idx: 15 },
  { id:'f-other',        idx: 16 },
  { id:'f-trPct',        idx: 17 },
  { id:'f-otherTrasp',   idx: 18 },
  { id:'f-housing25',    idx: 19 },
  { id:'f-housing',      idx: 20 },
  { id:'f-transpStatus', idx: 21 },
  { id:'f-medical',      idx: 22 },
  { id:'f-contract',     idx: 23 },
  { id:'f-annualLeave',  idx: 24 },
  { id:'f-tickets',      idx: 25 },
  { id:'f-qiwaStart',    idx: 26 },
  { id:'f-qiwaEnd',      idx: 27 },
  { id:'f-status',       idx: 28 },
  { id:'f-dutyHours',    idx: 29 },
  { id:'f-idNo',         idx: 30 },
  { id:'f-idProfession', idx: 31 },
  { id:'f-idExpHijri',   idx: 32 },
  { id:'f-idExpGreg',    idx: 33 },
  { id:'f-idRemDays',    idx: 34 },
  { id:'f-ppNumber',     idx: 35 },
  { id:'f-issuePlace',   idx: 36 },
  { id:'f-issueDate',    idx: 37 },
  { id:'f-ppExpiry',     idx: 38 },
  { id:'f-jobEnded',     idx: 40 },
  { id:'f-maritalStatus',idx: 41 },
  { id:'f-serviceEnded', idx: 42 },
  { id:'f-iban',         idx: 43 },
  { id:'f-email',        idx: 44 },
];

function openDataForm() {
  dfCurrentTab = 'add';
  dfEditRowIdx = -1;
  switchTab('add');
  clearForm();
  document.getElementById('df-overlay').style.display = 'flex';
}
function closeDataForm() {
  document.getElementById('df-overlay').style.display = 'none';
  dfStatusMsg('', '');
}
function switchTab(tab) {
  dfCurrentTab = tab;
  document.getElementById('tab-add').classList.toggle('active', tab === 'add');
  document.getElementById('tab-update').classList.toggle('active', tab === 'update');
  document.getElementById('df-update-search').style.display = tab === 'update' ? 'block' : 'none';
  if (tab === 'add') {
    dfEditRowIdx = -1;
    clearForm();
    document.getElementById('df-fields').style.display = 'block';
    document.getElementById('f-empNum').removeAttribute('readonly');
  } else {
    document.getElementById('df-fields').style.display = 'none';
    document.getElementById('df-search-emp').value = '';
    document.getElementById('df-load-msg').textContent = '';
  }
  dfStatusMsg('', '');
}
function dfStatusMsg(msg, type) {
  const el = document.getElementById('df-status-msg');
  el.textContent = msg;
  el.style.color = type === 'ok' ? '#117a65' : type === 'err' ? '#c0392b' : '#555';
}
function clearForm() {
  FORM_FIELDS.forEach(f => { const el = document.getElementById(f.id); if (el) el.value = ''; });
  dfStatusMsg('', '');
}
function loadEmployeeForEdit() {
  const empNum = document.getElementById('df-search-emp').value.trim();
  if (!empNum) { document.getElementById('df-load-msg').textContent = 'Enter an employee number.'; return; }
  const doLoad = (rows) => {
    const idx = rows.slice(1).findIndex(r => (r[COL.empNum]||'').trim() === empNum);
    if (idx === -1) { document.getElementById('df-load-msg').textContent = `Employee ${empNum} not found.`; return; }
    dfEditRowIdx = idx + 1;
    const r = rows[dfEditRowIdx];
    FORM_FIELDS.forEach(f => { const el = document.getElementById(f.id); if (el) el.value = (r[f.idx]||'').trim(); });
    document.getElementById('f-empNum').setAttribute('readonly', true);
    document.getElementById('df-load-msg').textContent = '';
    document.getElementById('df-fields').style.display = 'block';
    dfStatusMsg(`Loaded: ${(r[COL.name]||'').trim()} — edit fields then click Save.`, 'info');
  };
  if (csvRows) { doLoad(csvRows); }
  else {
    loadSheetRows()
      .then(rows => doLoad(rows))
      .catch(() => { document.getElementById('df-load-msg').textContent = 'Failed to load data.'; });
  }
}
function formToRow(existingRow) {
  const maxCol = 45;
  const row = existingRow ? [...existingRow] : new Array(maxCol).fill('');
  while (row.length < maxCol) row.push('');
  FORM_FIELDS.forEach(f => { const el = document.getElementById(f.id); if (el) row[f.idx] = el.value.trim(); });
  return row;
}
function csvCell(val) {
  val = String(val == null ? '' : val);
  if (val.includes(',') || val.includes('"') || val.includes('\n')) return '"' + val.replace(/"/g, '""') + '"';
  return val;
}
function rowsToCSV(rows) { return rows.map(r => r.map(csvCell).join(',')).join('\n'); }

async function submitForm() {
  const empNum = document.getElementById('f-empNum').value.trim();
  const name   = document.getElementById('f-name').value.trim();
  if (!empNum) { dfStatusMsg('Employee Number is required.', 'err'); return; }
  if (!name)   { dfStatusMsg('Name is required.', 'err'); return; }

  dfStatusMsg('Saving to Google Sheets…', '');
  document.getElementById('df-submit-btn').disabled = true;
  try {
    const rows = await loadSheetRows();

    if (dfCurrentTab === 'add') {
      const exists = rows.slice(1).some(r => (r[COL.empNum]||'').trim() === empNum);
      if (exists) { dfStatusMsg(`Employee ${empNum} already exists. Use Update tab.`, 'err'); document.getElementById('df-submit-btn').disabled = false; return; }
      const newRow = formToRow(null);
      await fetch(GS_WRITE, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ action: 'add', row: newRow })
      });
      rows.push(newRow);
      csvRows = rows;
      dfStatusMsg('✅ Employee added to Google Sheets!', 'ok');
      clearForm();

    } else {
      if (dfEditRowIdx === -1) { dfStatusMsg('Load an employee first.', 'err'); document.getElementById('df-submit-btn').disabled = false; return; }
      const updatedRow = formToRow(rows[dfEditRowIdx]);
      const sheetRow   = dfEditRowIdx + 1;
      await fetch(GS_WRITE, {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify({ action: 'update', row: updatedRow, rowNum: sheetRow })
      });
      rows[dfEditRowIdx] = updatedRow;
      csvRows = rows;
      dfStatusMsg('✅ Employee updated in Google Sheets!', 'ok');
    }
  } catch(e) {
    dfStatusMsg(`❌ Error: ${e.message}`, 'err');
  }
  document.getElementById('df-submit-btn').disabled = false;
}
</script>

<script>
/* ════════════════════════════════
   SEARCH & LISTS PANEL
════════════════════════════════ */
let slCurrentTab = 'deep';

function openSearchPanel() {
  slCurrentTab = 'deep';
  switchSLTab('deep');
  document.getElementById('sl-overlay').style.display = 'flex';
  setTimeout(() => { const el = document.getElementById('sl-ds-input'); if(el) el.focus(); }, 100);
}
function closeSearchPanel() {
  document.getElementById('sl-overlay').style.display = 'none';
}
function switchSLTab(tab) {
  slCurrentTab = tab;
  document.getElementById('sl-tab-deep').classList.toggle('active', tab === 'deep');
  document.getElementById('sl-tab-lists').classList.toggle('active', tab === 'lists');
  document.getElementById('sl-deep-pane').style.display  = tab === 'deep'  ? 'block' : 'none';
  document.getElementById('sl-lists-pane').style.display = tab === 'lists' ? 'block' : 'none';
}

/* Print result in new window */
function printPaneResult(pane) {
  const resultEl = document.getElementById(pane === 'ds' ? 'sl-ds-result' : 'sl-list-result');
  if (!resultEl || !resultEl.innerHTML.trim()) return;
  const win = window.open('', '_blank', 'width=900,height=700');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>Nour Energy — Report</title>
  <style>
    body { font-family: Calibri, sans-serif; margin: 10mm; }

    .ds-header { display:flex; align-items:center; gap:14px; margin-bottom:12px; padding-bottom:8px; border-bottom:2px solid #d5e8f5; }
    .ds-header img { height:52px; }
    .ds-header span { font-size:15px; font-weight:700; color:#1a5276; }
    table { width:100%; border-collapse:collapse; font-size:12px; }
    th { background:#1a5276; color:#fff; padding:6px 8px; text-align:left; }
    td { border:1px solid #c8d8e8; padding:5px 8px; }
    tr:nth-child(even) td { background:#f7fbff; }
    .card-footer { margin-top:12px; text-align:right; font-size:10px; color:#888; }
    .ds-count { font-size:11px; color:#888; margin-top:6px; text-align:right; }
  </style></head><body>
  ${resultEl.innerHTML}
  </body></html>`);
  win.document.close();
  win.focus();
  setTimeout(() => { win.print(); }, 400);
}

/* Enter key for deep search + Age filter — init after DOM ready */
document.addEventListener('DOMContentLoaded', function() {
  const dsInput = document.getElementById('sl-ds-input');
  if (dsInput) dsInput.addEventListener('keyup', e => { if (e.key === 'Enter') runDeepSearch(); });

  const ageOp = document.getElementById('fl-age-op');
  if (ageOp) ageOp.addEventListener('change', function() {
    const isBetween = this.value === 'between';
    document.getElementById('fl-age-and').style.display  = isBetween ? 'inline' : 'none';
    document.getElementById('fl-age-val2').style.display = isBetween ? 'inline-block' : 'none';
  });
});

/* ── Column map for Smart Lists ── */
const SL_COL_MAP = {
  jobTitle:     { idx: COL.jobTitle,     label: 'Job Title'       },
  location:     { idx: COL.location,     label: 'Location'        },
  nationality:  { idx: COL.nationality,  label: 'Nationality'     },
  age:          { idx: COL.age,          label: 'Age'             },
  mobile:       { idx: COL.mobile,       label: 'Mobile'          },
  maritalStatus:{ idx: COL.maritalStatus,label: 'Marital Status'  },
  joiningDate:  { idx: COL.joiningDate,  label: 'Joining Date'    },
  idExpGreg:    { idx: COL.idExpGreg,    label: 'Iqama Expiry'    },
  idRemDays:    { idx: COL.idRemDays,    label: 'Iqama Days Left' },
  ppExpiry:     { idx: COL.ppExpiry,     label: 'Passport Expiry' },
  qiwaEnd:      { idx: COL.qiwaEnd,      label: 'Qiwa Ending'     },
  jobEnded:     { idx: COL.jobEnded,     label: 'Job Ended'       },
  email:        { idx: COL.email,        label: 'Email'           },
  iban:         { idx: COL.iban,         label: 'IBAN'            },
};

/* ── Parse age value from cell (handles "35 Years", "35Y", "35") ── */
function parseAge(val) {
  if (!val) return null;
  const n = parseInt(val.toString().replace(/[^0-9]/g, ''));
  return isNaN(n) ? null : n;
}

/* ── Parse remaining days (handles "073 Days to Expire", "-5", "73") ── */
function parseRemDays(val) {
  if (!val) return null;
  const n = parseInt(val.toString().replace(/[^0-9\-]/g, ''));
  return isNaN(n) ? null : n;
}

/* ── Build result table ── */
function buildResultTable(rows, extraCols, title) {
  if (rows.length === 0) return `<p style="color:#c0392b;padding:20px 0;font-size:14px;">No records found.</p>`;

  let html = `<div class="ds-wrap">`;
  html += `<div class="ds-header">
    <img src="nour_energy_logo.png" alt="Logo" onerror="this.style.display='none'">
    <span>${title} &nbsp;·&nbsp; ${rows.length} record${rows.length !== 1 ? 's' : ''}</span>
  </div>`;
  html += `<table class="ds-tbl"><thead><tr>
    <th>Emp No</th><th>Name</th>`;
  extraCols.forEach(c => { html += `<th>${c.label}</th>`; });
  html += `</tr></thead><tbody>`;
  rows.forEach(r => {
    html += `<tr onclick="closeSearchPanel();loadCardByEmpNum('${(r[COL.empNum]||'').trim().replace(/'/g,"\\'")}')">
      <td>${v(r[COL.empNum])}</td>
      <td>${rtlWrap(v(r[COL.name]))}</td>`;
    extraCols.forEach(c => { html += `<td>${v(r[c.idx])}</td>`; });
    html += `</tr>`;
  });
  html += `</tbody></table>`;
  html += `<div class="ds-count">${rows.length} record${rows.length !== 1 ? 's' : ''} — click row to open card</div>`;
  html += `<div class="card-footer">Printed: ${todayStr()}<br>Created by: Qasim</div>`;
  html += `</div>`;
  return html;
}

/* ── Deep Search ── */
function runDeepSearch() {
  const query = document.getElementById('sl-ds-input').value.trim().toLowerCase();
  if (!query) { alert('Type something to search.'); return; }

  const doSearch = (rows) => {
    const results = [];
    rows.slice(1).forEach(r => {
      const matchedCols = [];
      DS_ALL_COLS.forEach(col => {
        if ((r[col.idx]||'').toLowerCase().includes(query)) matchedCols.push(col);
      });
      if (matchedCols.length > 0) results.push({ r, matchedCols });
    });

    if (results.length === 0) {
      document.getElementById('sl-ds-result').innerHTML =
        `<p style="color:#c0392b;font-size:14px;">No results for "<strong>${query}</strong>".</p>`;
      return;
    }

    const extraColKeys = new Set();
    results.forEach(({ matchedCols }) => matchedCols.forEach(col => {
      if (!DS_FIXED_IDX.has(col.idx)) extraColKeys.add(col.key);
    }));
    const extraCols = DS_ALL_COLS.filter(c => extraColKeys.has(c.key));

    let html = `<div class="ds-wrap">`;
    html += `<div class="ds-header">
      <img src="nour_energy_logo.png" alt="Logo" onerror="this.style.display='none'">
      <span>Deep Search — "<em>${query}</em>" &nbsp;·&nbsp; ${results.length} record${results.length !== 1 ? 's' : ''}</span>
    </div>`;
    html += `<table class="ds-tbl"><thead><tr>`;
    DS_FIXED.forEach(c => { html += `<th>${c.label}</th>`; });
    extraCols.forEach(c => { html += `<th>${c.label}</th>`; });
    html += `</tr></thead><tbody>`;
    results.forEach(({ r, matchedCols }) => {
      const matchedIdxSet = new Set(matchedCols.map(c => c.idx));
      html += `<tr onclick="closeSearchPanel();loadCardByEmpNum('${(r[COL.empNum]||'').trim().replace(/'/g,"\\'")}')">`;
      DS_FIXED.forEach(c => {
        const val = v(r[c.idx]);
        const hi  = matchedIdxSet.has(c.idx) ? ' ds-match' : '';
        html += `<td class="${hi}">${c.idx === COL.name ? rtlWrap(val) : val}</td>`;
      });
      extraCols.forEach(c => {
        const hi = matchedIdxSet.has(c.idx) ? ' ds-match' : '';
        html += `<td class="${hi}">${v(r[c.idx])}</td>`;
      });
      html += `</tr>`;
    });
    html += `</tbody></table>`;
    html += `<div class="ds-count">${results.length} record${results.length !== 1 ? 's' : ''} — click row to open card</div>`;
    html += `<div class="card-footer">Printed: ${todayStr()}<br>Created by: Qasim</div>`;
    html += `</div>`;
    document.getElementById('sl-ds-result').innerHTML = html;
    document.getElementById('sl-ds-print-bar').style.display = 'block';
  };

  if (csvRows) doSearch(csvRows);
  else loadSheetRows().then(rows=>{doSearch(rows);})
       .catch(()=>{ document.getElementById('sl-ds-result').innerHTML='<p style="color:#c0392b">Failed to load data.</p>'; });
}

/* ── Quick Lists ── */
function runQuickList(type) {
  const doList = (rows) => {
    const today = new Date(); today.setHours(0,0,0,0);
    let filtered = [], extraCols = [], title = '';

    const active = rows.slice(1).filter(r => { const je=(r[COL.jobEnded]||'').trim(); return je===''||je==='—'; });
    const all    = rows.slice(1);

    if (type === 'active') {
      filtered  = active;
      extraCols = [SL_COL_MAP.jobTitle, SL_COL_MAP.location, SL_COL_MAP.nationality];
      title     = '🟢 Active Employees';
    } else if (type === 'ended') {
      filtered  = all.filter(r => { const je=(r[COL.jobEnded]||'').trim(); return je!==''&&je!=='—'; });
      extraCols = [SL_COL_MAP.jobTitle, SL_COL_MAP.location, SL_COL_MAP.jobEnded];
      title     = '🔴 Job Ended';
    } else {
      const days = parseInt(type.replace(/[^0-9]/g,''));
      let colIdx, colLabel, expLabel;
      if (type.startsWith('iqama')) {
        colIdx=COL.idRemDays; expLabel=`Iqama — Within ${days} Days`;
        extraCols=[SL_COL_MAP.jobTitle, SL_COL_MAP.idExpGreg, SL_COL_MAP.idRemDays];
        filtered = active.filter(r => {
          const d = parseRemDays(r[colIdx]);
          return d !== null && d >= 0 && d <= days;
        });
      } else if (type.startsWith('pp')) {
        expLabel=`Passport — Within ${days} Days`;
        extraCols=[SL_COL_MAP.jobTitle, SL_COL_MAP.ppExpiry];
        filtered = active.filter(r => {
          const d = daysDiff((r[COL.ppExpiry]||'').trim());
          return d !== null && d >= 0 && d <= days;
        });
      } else {
        expLabel=`Qiwa — Within ${days} Days`;
        extraCols=[SL_COL_MAP.jobTitle, SL_COL_MAP.qiwaEnd];
        filtered = active.filter(r => {
          const d = daysDiff((r[COL.qiwaEnd]||'').trim());
          return d !== null && d >= 0 && d <= days;
        });
      }
      title = `🟠 ${expLabel}`;
    }

    document.getElementById('sl-list-result').innerHTML = buildResultTable(filtered, extraCols, title);
    document.getElementById('sl-list-print-bar').style.display = 'block';
  };

  if (csvRows) doList(csvRows);
  else loadSheetRows().then(rows=>{doList(rows);})
       .catch(()=>{ document.getElementById('sl-list-result').innerHTML='<p style="color:#c0392b">Failed to load data.</p>'; });
}

/* ── Combined Filter ── */
function runCombinedFilter() {
  const flJobTitle    = document.getElementById('fl-jobTitle').value.trim().toLowerCase();
  const flLocation    = document.getElementById('fl-location').value.trim().toLowerCase();
  const flNationality = document.getElementById('fl-nationality').value.trim().toLowerCase();
  const flAgeOp       = document.getElementById('fl-age-op').value;
  const flAgeVal1     = parseInt(document.getElementById('fl-age-val1').value);
  const flAgeVal2     = parseInt(document.getElementById('fl-age-val2').value);
  const flMarital     = document.getElementById('fl-marital').value.trim().toLowerCase();
  const flStatus      = document.getElementById('fl-status').value.trim().toLowerCase();
  const flEnded       = document.getElementById('fl-ended').value;

  // Selected extra columns
  const checkedCols = [];
  document.querySelectorAll('#sl-col-picks input[type=checkbox]:checked').forEach(cb => {
    if (SL_COL_MAP[cb.value]) checkedCols.push(SL_COL_MAP[cb.value]);
  });

  const doFilter = (rows) => {
    const filtered = rows.slice(1).filter(r => {
      const je = (r[COL.jobEnded]||'').trim();
      const isEnded = je !== '' && je !== '—';

      // Job ended filter
      if (flEnded === 'no'   && isEnded)  return false;
      if (flEnded === 'only' && !isEnded) return false;

      // Text filters (partial match)
      if (flJobTitle    && !(r[COL.jobTitle]    ||'').toLowerCase().includes(flJobTitle))    return false;
      if (flLocation    && !(r[COL.location]    ||'').toLowerCase().includes(flLocation))    return false;
      if (flNationality && !(r[COL.nationality] ||'').toLowerCase().includes(flNationality)) return false;
      if (flMarital     && !(r[COL.maritalStatus]||'').toLowerCase().includes(flMarital))    return false;
      if (flStatus      && !(r[COL.status]      ||'').toLowerCase().includes(flStatus))      return false;

      // Age filter
      if (flAgeOp && !isNaN(flAgeVal1)) {
        const age = parseAge(r[COL.age]);
        if (age === null) return false;
        if (flAgeOp === 'lt'      && !(age <  flAgeVal1)) return false;
        if (flAgeOp === 'gte'     && !(age >= flAgeVal1)) return false;
        if (flAgeOp === 'exact'   && !(age === flAgeVal1)) return false;
        if (flAgeOp === 'between' && !isNaN(flAgeVal2) && !(age >= flAgeVal1 && age <= flAgeVal2)) return false;
      }

      return true;
    });

    // Build title from active filters
    const parts = [];
    if (flJobTitle)    parts.push(`Job: ${flJobTitle}`);
    if (flLocation)    parts.push(`Location: ${flLocation}`);
    if (flNationality) parts.push(`Nationality: ${flNationality}`);
    if (flMarital)     parts.push(`Marital: ${flMarital}`);
    if (flStatus)      parts.push(`Status: ${flStatus}`);
    if (flAgeOp && !isNaN(flAgeVal1)) {
      if (flAgeOp==='lt')      parts.push(`Age < ${flAgeVal1}`);
      if (flAgeOp==='gte')     parts.push(`Age ≥ ${flAgeVal1}`);
      if (flAgeOp==='exact')   parts.push(`Age = ${flAgeVal1}`);
      if (flAgeOp==='between') parts.push(`Age ${flAgeVal1}–${flAgeVal2}`);
    }
    const title = parts.length ? `📋 ${parts.join(' · ')}` : '📋 All Employees';

    document.getElementById('sl-list-result').innerHTML = buildResultTable(filtered, checkedCols, title);
    document.getElementById('sl-list-print-bar').style.display = 'block';
  };

  if (csvRows) doFilter(csvRows);
  else loadSheetRows().then(rows=>{doFilter(rows);})
       .catch(()=>{ document.getElementById('sl-list-result').innerHTML='<p style="color:#c0392b">Failed to load data.</p>'; });
}

function resetFilter() {
  ['fl-jobTitle','fl-location','fl-nationality','fl-status'].forEach(id=>{ document.getElementById(id).value=''; });
  document.getElementById('fl-age-op').value = '';
  document.getElementById('fl-age-val1').value = '';
  document.getElementById('fl-age-val2').value = '';
  document.getElementById('fl-age-and').style.display = 'none';
  document.getElementById('fl-age-val2').style.display = 'none';
  document.getElementById('fl-marital').value = '';
  document.getElementById('fl-ended').value = 'no';
  document.getElementById('sl-list-result').innerHTML = '';
  document.getElementById('sl-list-print-bar').style.display = 'none';
}

════════════════════════════ */
let inlineCurrentTab = 'deep';

function toggleSmartLists() {
  const panel = document.getElementById('inline-search-panel');

  } else {
    panel.style.display = 'block';
    document.getElementById('ipane-lists').style.display = 'block';
    btn.classList.add('active');
  }
}

function switchInlineTab(tab) {
  inlineCurrentTab = tab;
  document.getElementById('inline-search-panel').style.display = 'block';
  document.getElementById('ipane-lists').style.display = 'block';
}

document.addEventListener('DOMContentLoaded', function() {
  // Auto-focus password box on load

  if (pwInput) setTimeout(() => pwInput.focus(), 100);

    document.getElementById('ifl-age-val2').style.display = b ? 'inline-block' : 'none';
  });
  // Modal age filter
  const maop = document.getElementById('fl-age-op');
  if (maop) maop.addEventListener('change', function() {
    const b = this.value === 'between';
    document.getElementById('fl-age-and').style.display  = b ? 'inline' : 'none';
    document.getElementById('fl-age-val2').style.display = b ? 'inline-block' : 'none';
  });
});

function runInlineDeepSearch() {
  const query = (document.getElementById('isl-deep-input').value || '').trim().toLowerCase();
  if (!query) { alert('Type something to search.'); return; }
  const doSearch = (rows) => {
    const results = [];
    rows.slice(1).forEach(r => {
      const matchedCols = [];
      DS_ALL_COLS.forEach(col => { if ((r[col.idx]||'').toLowerCase().includes(query)) matchedCols.push(col); });
      if (matchedCols.length > 0) results.push({ r, matchedCols });
    });
    if (results.length === 0) {
      document.getElementById('isl-ds-result').innerHTML = `<p style="color:#c0392b;font-size:14px;">No results for "<strong>${query}</strong>".</p>`;
      document.getElementById('isl-ds-print-bar').style.display = 'none';
      return;
    }
    const extraColKeys = new Set();
    results.forEach(({ matchedCols }) => matchedCols.forEach(col => { if (!DS_FIXED_IDX.has(col.idx)) extraColKeys.add(col.key); }));
    const extraCols = DS_ALL_COLS.filter(c => extraColKeys.has(c.key));
    let html = `<div class="ds-wrap"><div class="ds-header">
      <img src="nour_energy_logo.png" alt="Logo" onerror="this.style.display='none'">
      <span>Deep Search — "<em>${query}</em>" · ${results.length} record${results.length!==1?'s':''}</span>
    </div><table class="ds-tbl"><thead><tr>`;
    DS_FIXED.forEach(c => { html += `<th>${c.label}</th>`; });
    extraCols.forEach(c => { html += `<th>${c.label}</th>`; });
    html += `</tr></thead><tbody>`;
    results.forEach(({ r, matchedCols }) => {
      const midx = new Set(matchedCols.map(c => c.idx));
      html += `<tr onclick="loadCardByEmpNum('${(r[COL.empNum]||'').trim().replace(/'/g,"\\'")}')">`;
      DS_FIXED.forEach(c => { html += `<td class="${midx.has(c.idx)?' ds-match':''}">${c.idx===COL.name?rtlWrap(v(r[c.idx])):v(r[c.idx])}</td>`; });
      extraCols.forEach(c => { html += `<td class="${midx.has(c.idx)?' ds-match':''}">${v(r[c.idx])}</td>`; });
      html += `</tr>`;
    });
    html += `</tbody></table><div class="ds-count">${results.length} record${results.length!==1?'s':''} — click row to open card</div>
    <div class="card-footer">Printed: ${todayStr()}<br>Created by: Qasim</div></div>`;
    document.getElementById('isl-ds-result').innerHTML = html;
    document.getElementById('isl-ds-print-bar').style.display = 'block';
  };
  if (csvRows) doSearch(csvRows);
  else loadSheetRows().then(rows=>{doSearch(rows);})
       .catch(()=>{ document.getElementById('isl-ds-result').innerHTML='<p style="color:#c0392b">Failed to load data.</p>'; });
}

function runInlineQuickList(type) {
  const doList = (rows) => {
    let filtered=[], extraCols=[], title='';
    const active = rows.slice(1).filter(r=>{ const je=(r[COL.jobEnded]||'').trim(); return je===''||je==='—'; });
    if (type==='active') { filtered=active; extraCols=[SL_COL_MAP.jobTitle,SL_COL_MAP.location,SL_COL_MAP.nationality]; title='🟢 Active Employees'; }
    else if (type==='ended') { filtered=rows.slice(1).filter(r=>{ const je=(r[COL.jobEnded]||'').trim(); return je!==''&&je!=='—'; }); extraCols=[SL_COL_MAP.jobTitle,SL_COL_MAP.location,SL_COL_MAP.jobEnded]; title='🔴 Job Ended'; }
    else {
      const days=parseInt(type.replace(/[^0-9]/g,''));
      if (type.startsWith('iqama')) { extraCols=[SL_COL_MAP.jobTitle,SL_COL_MAP.idExpGreg,SL_COL_MAP.idRemDays]; title=`🟠 Iqama — Within ${days} Days`; filtered=active.filter(r=>{ const d=parseRemDays(r[COL.idRemDays]); return d!==null&&d>=0&&d<=days; }); }
      else if (type.startsWith('pp')) { extraCols=[SL_COL_MAP.jobTitle,SL_COL_MAP.ppExpiry]; title=`🟠 Passport — Within ${days} Days`; filtered=active.filter(r=>{ const d=daysDiff((r[COL.ppExpiry]||'').trim()); return d!==null&&d>=0&&d<=days; }); }
      else { extraCols=[SL_COL_MAP.jobTitle,SL_COL_MAP.qiwaEnd]; title=`🟠 Qiwa — Within ${days} Days`; filtered=active.filter(r=>{ const d=daysDiff((r[COL.qiwaEnd]||'').trim()); return d!==null&&d>=0&&d<=days; }); }
    }
    document.getElementById('isl-list-result').innerHTML = buildResultTable(filtered, extraCols, title);
    document.getElementById('isl-list-print-bar').style.display = filtered.length > 0 ? 'block' : 'none';
  };
  if (csvRows) doList(csvRows);
  else loadSheetRows().then(rows=>{doList(rows);})
       .catch(()=>{ document.getElementById('isl-list-result').innerHTML='<p style="color:#c0392b">Failed to load.</p>'; });
}

function runInlineCombinedFilter() {
  const flJobTitle    = document.getElementById('ifl-jobTitle').value.trim().toLowerCase();
  const flNationality = document.getElementById('ifl-nationality').value.trim().toLowerCase();
  const flLocation    = document.getElementById('ifl-location').value.trim().toLowerCase();
  const flAgeOp       = document.getElementById('ifl-age-op').value;
  const flAgeVal1     = parseInt(document.getElementById('ifl-age-val1').value);
  const flAgeVal2     = parseInt(document.getElementById('ifl-age-val2').value);
  const flEnded       = document.getElementById('ifl-ended').value;
  const checkedCols   = [];
  document.querySelectorAll('#isl-col-picks input[type=checkbox]:checked').forEach(cb => {
    if (SL_COL_MAP[cb.value]) checkedCols.push(SL_COL_MAP[cb.value]);
  });
  const doFilter = (rows) => {
    const filtered = rows.slice(1).filter(r => {
      const je = (r[COL.jobEnded]||'').trim();
      const isEnded = je !== '' && je !== '—';
      if (flEnded === 'no'   && isEnded)  return false;
      if (flEnded === 'only' && !isEnded) return false;
      if (flJobTitle    && !(r[COL.jobTitle]   ||'').toLowerCase().includes(flJobTitle))    return false;
      if (flNationality && !(r[COL.nationality]||'').toLowerCase().includes(flNationality)) return false;
      if (flLocation    && !(r[COL.location]   ||'').toLowerCase().includes(flLocation))    return false;
      if (flAgeOp && !isNaN(flAgeVal1)) {
        const age = parseAge(r[COL.age]);
        if (age === null) return false;
        if (flAgeOp === 'lt'      && !(age <  flAgeVal1)) return false;
        if (flAgeOp === 'gte'     && !(age >= flAgeVal1)) return false;
        if (flAgeOp === 'exact'   && !(age === flAgeVal1)) return false;
        if (flAgeOp === 'between' && !isNaN(flAgeVal2) && !(age >= flAgeVal1 && age <= flAgeVal2)) return false;
      }
      return true;
    });
    const parts = [];
    if (flJobTitle)    parts.push(`Job: ${flJobTitle}`);
    if (flNationality) parts.push(`Nationality: ${flNationality}`);
    if (flLocation)    parts.push(`Location: ${flLocation}`);
    if (flAgeOp && !isNaN(flAgeVal1)) {
      if (flAgeOp === 'lt')      parts.push(`Age < ${flAgeVal1}`);
      if (flAgeOp === 'gte')     parts.push(`Age ≥ ${flAgeVal1}`);
      if (flAgeOp === 'exact')   parts.push(`Age = ${flAgeVal1}`);
      if (flAgeOp === 'between') parts.push(`Age ${flAgeVal1}–${flAgeVal2}`);
    }
    if (flEnded === 'only') parts.push('Job Ended');
    if (flEnded === 'no')   parts.push('Active Only');
    const title = parts.length ? `📋 ${parts.join(' · ')}` : '📋 All Employees';
    document.getElementById('isl-list-result').innerHTML = buildResultTable(filtered, checkedCols, title);
    document.getElementById('isl-list-print-bar').style.display = filtered.length > 0 ? 'block' : 'none';
    document.getElementById('isl-count-badge').textContent = `${filtered.length} record${filtered.length !== 1 ? 's' : ''} found`;
  };
  if (csvRows) doFilter(csvRows);
  else loadSheetRows().then(rows=>{doFilter(rows);})
       .catch(()=>{ document.getElementById('isl-list-result').innerHTML='<p style="color:#c0392b">Failed to load.</p>'; });
}

function setAllCols(checked) {
  document.querySelectorAll('#isl-col-picks input[type=checkbox]').forEach(cb => cb.checked = checked);
}

function resetInlineFilter() {
  document.getElementById('ifl-jobTitle').value    = '';
  document.getElementById('ifl-nationality').value = '';
  document.getElementById('ifl-location').value    = '';
  document.getElementById('ifl-age-op').value      = '';
  document.getElementById('ifl-age-val1').value    = '';
  document.getElementById('ifl-age-val2').value    = '';
  document.getElementById('ifl-age-and').style.display  = 'none';
  document.getElementById('ifl-age-val2').style.display = 'none';
  document.getElementById('ifl-ended').value       = 'no';
  document.getElementById('isl-list-result').innerHTML  = '';
  document.getElementById('isl-list-print-bar').style.display = 'none';
  document.getElementById('isl-count-badge').textContent = '';
}

function printInlineResult(pane) {
  const el = document.getElementById(pane==='ds'?'isl-ds-result':'isl-list-result');
  if (!el||!el.innerHTML.trim()) return;
  const win = window.open('','_blank','width=900,height=700');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Nour Energy Report</title>
  <style>body{font-family:Calibri,sans-serif;margin:10mm}.ds-header{display:flex;align-items:center;gap:14px;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #d5e8f5}.ds-header img{height:52px}.ds-header span{font-size:15px;font-weight:700;color:#1a5276}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#1a5276;color:#fff;padding:6px 8px;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}td{border:1px solid #c8d8e8;padding:5px 8px}tr:nth-child(even) td{background:#f7fbff}.card-footer{margin-top:12px;text-align:right;font-size:10px;color:#888}.ds-count{font-size:11px;color:#888;margin-top:6px;text-align:right}</style>
  </head><body>${el.innerHTML}</body></html>`);
  win.document.close(); win.focus();
  setTimeout(()=>{ win.print(); }, 400);
}
