<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nour Energy Data</title>
<link rel="icon" href="nour_energy_logo.png" type="image/png">
<style>
/* ── Reset & Base ── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; font-family: 'Calibri', sans-serif; background: #f0f4f8; direction: ltr; }

/* ── App Shell ── */
@media screen {
  #app-shell {
    width: 940px;
    margin: 28px auto 40px;
  }
}

/* ── Top Bar ── */
#top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 22px;
  gap: 20px;
}
#top-bar-left {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}
#top-bar-left h1 {
  font-size: 26px;
  color: #1a5276;
  margin: 0 0 10px 0;
  font-weight: 700;
  letter-spacing: 0.3px;
  line-height: 1.2;
}
#input-row {
  width: 100%;
  margin-bottom: 8px;
}
#employeeNumber {
  font-family: 'Arial Black', sans-serif;
  font-size: 18px;
  padding: 10px 14px;
  border: 2px solid #aaa;
  border-radius: 6px;
  width: 100%;
  height: 46px;
  box-sizing: border-box;
}
#btn-row {
  display: flex;
  gap: 10px;
  width: 100%;
}
#btn-row button {
  flex: 1;
  height: 46px;
  font-family: 'Calibri', sans-serif;
  font-size: 17px;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  padding: 0;
  white-space: nowrap;
}
#searchButton { background: #2e86c1; color: #fff; }
#searchButton:hover { background: #1a5276; }
#deepSearchButton { background: #6c3483; color: #fff; }
#deepSearchButton:hover { background: #512e5f; }
#printButton  { background: #f9e400; color: #111; }
#printButton:hover  { background: #e5d200; }
#clearButton  { background: #e74c3c; color: #fff; }
#clearButton:hover  { background: #c0392b; }

/* ── Logo ──
   Total left height = h1(~32px) + margin(10) + input(46) + margin(8) + buttons(46) = 142px */
#top-bar-right {
  flex-shrink: 0;
  height: 142px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#top-bar-right img {
  height: 142px;
  width: auto;
  display: block;
  object-fit: contain;
}

/* ── Logout Button ── */
#logoutButton {
  position: fixed;
  top: 12px;
  right: 18px;
  z-index: 999;
  height: 36px;
  padding: 0 18px;
  background: #c0392b;
  color: #fff;
  font-family: 'Calibri', sans-serif;
  font-size: 14px;
  font-weight: bold;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  display: none;
}
#logoutButton:hover { background: #922b21; }
@media print { #logoutButton { display: none !important; } }
#pw-overlay {
  position: fixed; inset: 0;
  background: rgba(15,30,50,0.72);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
#pw-box {
  background: #fff;
  border-radius: 10px;
  padding: 36px 40px 30px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
  text-align: center;
  width: 340px;
}
#pw-box img { height: 70px; margin-bottom: 16px; }
#pw-box h2 { font-size: 20px; color: #1a5276; margin: 0 0 6px; }
#pw-box p  { font-size: 13px; color: #777; margin: 0 0 18px; }
#pw-input {
  width: 100%; padding: 10px 14px; font-size: 16px;
  border: 2px solid #c8d8e8; border-radius: 6px;
  margin-bottom: 12px; box-sizing: border-box; text-align: center;
  letter-spacing: 3px;
}
#pw-input:focus { border-color: #2e86c1; outline: none; }
#pw-submit {
  width: 100%; padding: 11px; font-size: 16px; font-weight: bold;
  background: #2e86c1; color: #fff; border: none; border-radius: 6px; cursor: pointer;
}
#pw-submit:hover { background: #1a5276; }
#pw-error { color: #c0392b; font-size: 13px; margin-top: 10px; min-height: 18px; }

/* ── Card ── */
@media screen {
  .card {
    width: 100%;
    max-width: 100%;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 3px 18px rgba(0,0,0,0.13);
    padding: 22px 26px 18px;
    margin: 0 auto;
  }
}
@media print {
  .card {
    width: 100% !important;
    background: #fff !important;
    padding: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    page-break-inside: avoid;
  }
}

/* ── Card Header ── */
.card-hdr {
  display: flex;
  align-items: center;
  gap: 18px;
  margin-bottom: 18px;
  padding-bottom: 12px;
  border-bottom: 2px solid #d5e8f5;
}
.card-hdr img {
  height: 90px;
  width: auto;
}
.card-hdr-text .emp-name {
  font-family: 'Calibri', sans-serif;
  font-size: 24px;
  font-weight: 600;
  color: #1a5276;
  margin: 0;
  line-height: 1.2;
}
.card-hdr-text .emp-num {
  font-size: 18px;
  font-weight: 700;
  color: #555;
  margin: 4px 0 0 0;
}

/* ── Section Headers ── */
.sec-hdr {
  background: #1a5276;
  color: #fff;
  font-size: 13.5px;
  font-weight: 700;
  padding: 5px 10px;
  margin: 14px 0 0 0;
  letter-spacing: 0.4px;
  border-radius: 3px 3px 0 0;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}

/* ── Data Table ── */
.dtbl {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  margin-bottom: 0;
}
.dtbl colgroup col.lbl { width: 150px; }
.dtbl colgroup col.val { width: auto; }
.dtbl td, .dtbl th {
  border: 1px solid #c8d8e8;
  padding: 5px 9px;
  font-size: 13px;
  vertical-align: middle;
  text-align: left;
}
.dtbl .lbl-cell {
  font-weight: 700;
  background: #eaf2fb;
  color: #1a3a52;
  width: 150px;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.dtbl tr:nth-child(even) td:not(.lbl-cell) { background: #f7fbff; }

/* ── Job Ended highlight ── */
.job-ended-cell {
  background: #c0392b !important;
  color: #fff !important;
  font-weight: 700 !important;
  font-size: 15px !important;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.job-ended-badge {
  display: inline-block;
  background: #c0392b;
  color: #fff;
  font-weight: 700;
  font-size: 13px;
  padding: 2px 10px;
  border-radius: 4px;
  margin-left: 10px;
  vertical-align: middle;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}

/* ── Salary total row ── */
.salary-total-row td {
  background: #1e8449 !important;
  color: #fff !important;
  font-weight: 700 !important;
  font-size: 14px !important;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}

/* ── Alerts ── */
.alerts-block {
  margin-top: 14px;
  padding: 10px 14px;
  background: #fdfefe;
  border: 1px solid #c8d8e8;
  border-radius: 0 0 4px 4px;
  font-size: 13px;
}
.alerts-block .alert-item { margin: 3px 0; }
.verdict-line {
  margin-top: 8px;
  font-size: 13.5px;
  font-weight: 700;
  padding: 5px 10px;
  border-radius: 4px;
  display: inline-block;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.verdict-green { background: #d5f5e3; color: #1e8449; }
.verdict-yellow { background: #fef9e7; color: #b7950b; }
.verdict-red { background: #fadbd8; color: #c0392b; }

/* ── Footer ── */
.card-footer {
  margin-top: 16px;
  text-align: right;
  font-size: 11px;
  color: #888;
  line-height: 1.6;
}



/* ── Deep Search Results ── */
@media screen {
  .ds-wrap {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 3px 18px rgba(0,0,0,0.13);
    padding: 20px 26px 18px;
  }
}
@media print {
  .ds-wrap {
    width: 100% !important;
    background: #fff !important;
    padding: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    page-break-inside: avoid;
  }
  .ds-tbl { width: 100% !important; font-size: 11.5px; }
  .ds-tbl th { font-size: 11.5px; padding: 3px 8px; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .ds-tbl td { font-size: 11px; padding: 3px 8px; }
  .ds-header { display: none !important; }
}
.ds-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 2px solid #d5e8f5;
}
.ds-header img { height: 52px; width: auto; }
.ds-header span {
  font-size: 16px;
  font-weight: 700;
  color: #1a5276;
}
.ds-tbl {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.ds-tbl th {
  background: #1a5276;
  color: #fff;
  padding: 7px 10px;
  text-align: left;
  font-size: 13px;
  font-weight: 700;
  print-color-adjust: exact;
  -webkit-print-color-adjust: exact;
}
.ds-tbl td {
  border: 1px solid #c8d8e8;
  padding: 6px 10px;
  vertical-align: middle;
}
.ds-tbl tr:nth-child(even) td { background: #f7fbff; }
.ds-tbl tr:hover td { background: #eaf4fb; cursor: pointer; }
.ds-count {
  font-size: 12px;
  color: #888;
  margin-top: 8px;
  text-align: right;
}
.ds-match {
  background: #fef9e7 !important;
  font-weight: 700;
  color: #1a5276;
}
.no-print { display: block; }
@media print { .no-print { display: none !important; } }
#card-area:empty::after {
  content: 'Enter an Employee Number above and press Search.';
  display: block;
  text-align: center;
  color: #aaa;
  font-size: 15px;
  padding: 60px 0;
}

@media print {
  @page { margin: 10mm; size: A4; }
  html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; width: 100% !important; }
  #app-shell { width: 100% !important; max-width: 100% !important; margin: 0 !important; padding: 0 !important; }
  #card-area { width: 100% !important; margin: 0 !important; padding: 0 !important; }
  #top-bar, #pw-overlay, #logoutButton, .no-print { display: none !important; }
  .card-hdr { margin-bottom: 10px; padding-bottom: 8px; }
  .card-hdr img { height: 52px !important; }
  .card-hdr-text .emp-name { font-size: 20px; }
  .card-hdr-text .emp-num { font-size: 15px; }
  .sec-hdr { margin: 8px 0 0 0; font-size: 12px; padding: 4px 8px; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .dtbl { width: 100% !important; }
  .dtbl td, .dtbl th { font-size: 11.5px; padding: 3px 8px; }
  .lbl-cell { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .job-ended-cell { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .salary-total-row td { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .alerts-block { font-size: 11.5px; padding: 6px 10px; }
  .verdict-line { font-size: 12px; padding: 3px 8px; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .card-footer { font-size: 10px; margin-top: 10px; }
}
</style>
</head>
<body>

<!-- ── Password Overlay ── -->
<div id="pw-overlay">
  <div id="pw-box">
    <img src="nour_energy_logo.png" alt="Nour Energy" onerror="this.style.display='none'">
    <h2>Nour Energy Data</h2>
    <p>Enter your Employee Number for basic access,<br>or the admin password for full access</p>
    <input type="password" id="pw-input" placeholder="Employee Number" autocomplete="off">
    <button id="pw-submit" onclick="checkPassword()">Login</button>
    <div id="pw-error"></div>
  </div>
</div>

<button id="logoutButton" onclick="logout()">⏻ Logout</button>

<div id="app-shell">

  <!-- Top Bar -->
  <div id="top-bar">
    <div id="top-bar-left">
      <h1>Nour Energy Data</h1>
      <div id="input-row">
        <input type="text" id="employeeNumber" placeholder="Employee Number or ID No">
      </div>
      <div id="btn-row">
        <button id="searchButton" onclick="searchEmployee()">Search</button>
        <button id="deepSearchButton" onclick="deepSearch()" style="display:none;">Deep Search</button>
        <button id="printButton" onclick="window.print()">Print</button>
        <button id="clearButton" onclick="clearCard()">Clear Data</button>
      </div>
    </div>
    <div id="top-bar-right">
      <img src="nour_energy_logo.png" alt="Nour Energy Logo">
    </div>
  </div>

  <!-- Card / Output Area -->
  <div id="card-area"></div>

</div>

<script>
/* ─── Column index map — must be first ─── */
const COL = {
  empNum:        0,
  name:          1,
  mobile:        2,
  nationality:   3,
  jobTitle:      4,
  location:      5,
  joiningDate:   7,
  total:         13,
  basic:         14,
  food:          15,
  other:         16,
  trPct:         17,
  otherTrasp:    18,
  housing25:     19,
  housing:       20,
  transpStatus:  21,
  medical:       22,
  contract:      23,
  annualLeave:   24,
  tickets:       25,
  qiwaStart:     26,
  qiwaEnd:       27,
  status:        28,
  dutyHours:     29,
  idNo:          30,
  idProfession:  31,
  idExpHijri:    32,
  idExpGreg:     33,
  idRemDays:     34,
  ppNumber:      35,
  issuePlace:    36,
  issueDate:     37,
  ppExpiry:      38,
  jobEnded:      40,
  maritalStatus: 41,
  serviceEnded:  42,
  iban:          43,
  email:         44,
  serviceCont:   9,
  dob:           10,
  age:           12,
};

/* ─── Access Level ─── */
// 'none' = not logged in | 'employee' = emp number login | 'admin' = nour-pr
let currentAccessLevel = 'none';
let csvRows = null;

function checkPassword() {
  const entered = document.getElementById('pw-input').value.trim();
  if (!entered) { document.getElementById('pw-error').textContent = 'Please enter your password or employee number.'; return; }

  // Full admin access
  if (entered === 'nour-pr') {
    currentAccessLevel = 'admin';
    unlockApp();
    return;
  }

  // Employee number login — needs CSV validation
  const doValidate = (rows) => {
    csvRows = rows;
    const valid = rows.slice(1).some(r => (r[COL.empNum]||'').trim() === entered);
    if (valid) {
      currentAccessLevel = 'employee';
      unlockApp();
    } else {
      document.getElementById('pw-error').textContent = 'Access denied. Not recognised.';
      document.getElementById('pw-input').value = '';
    }
  };

  if (csvRows) {
    doValidate(csvRows);
  } else {
    fetch('Master File - Test copy.csv')
      .then(r => r.text())
      .then(csv => doValidate(parseCSV(csv)))
      .catch(() => {
        document.getElementById('pw-error').textContent = 'Could not load data file. Please try again.';
      });
  }
}

function unlockApp() {
  document.getElementById('pw-overlay').style.display = 'none';
  document.getElementById('pw-input').value = '';
  document.getElementById('pw-error').textContent = '';
  document.getElementById('logoutButton').style.display = 'block';
  // Deep Search only for admin
  document.getElementById('deepSearchButton').style.display =
    currentAccessLevel === 'admin' ? 'block' : 'none';
  document.getElementById('employeeNumber').focus();
}

/* ─── Logout ─── */
function logout() {
  currentAccessLevel = 'none';
  csvRows = null;
  clearCard();
  document.getElementById('logoutButton').style.display = 'none';
  document.getElementById('deepSearchButton').style.display = 'none';
  document.getElementById('pw-overlay').style.display = 'flex';
  document.getElementById('pw-input').focus();
}

/* ─── Deep Search ─── */

// All searchable columns with their label and COL key
const DS_ALL_COLS = [
  { key: 'empNum',       label: 'Emp No',            idx: 0  },
  { key: 'name',         label: 'Name',               idx: 1  },
  { key: 'mobile',       label: 'Mobile',             idx: 2  },
  { key: 'nationality',  label: 'Nationality',        idx: 3  },
  { key: 'jobTitle',     label: 'Job Title',          idx: 4  },
  { key: 'location',     label: 'Location',           idx: 5  },
  { key: 'joiningDate',  label: 'Joining Date',       idx: 7  },
  { key: 'serviceCont',  label: 'Service',            idx: 9  },
  { key: 'dob',          label: 'Date of Birth',      idx: 10 },
  { key: 'age',          label: 'Age',                idx: 12 },
  { key: 'total',        label: 'Total Salary',       idx: 13 },
  { key: 'basic',        label: 'Basic Salary',       idx: 14 },
  { key: 'food',         label: 'Food Allowance',     idx: 15 },
  { key: 'other',        label: 'Other',              idx: 16 },
  { key: 'trPct',        label: 'Transport 10%',      idx: 17 },
  { key: 'otherTrasp',   label: 'Other Transport',    idx: 18 },
  { key: 'housing25',    label: 'Housing 25%',        idx: 19 },
  { key: 'housing',      label: 'Housing',            idx: 20 },
  { key: 'medical',      label: 'Medical',            idx: 22 },
  { key: 'contract',     label: 'Contract',           idx: 23 },
  { key: 'annualLeave',  label: 'Annual Leave',       idx: 24 },
  { key: 'tickets',      label: 'Tickets',            idx: 25 },
  { key: 'qiwaStart',    label: 'Qiwa Start',         idx: 26 },
  { key: 'qiwaEnd',      label: 'Qiwa Ending',        idx: 27 },
  { key: 'status',       label: 'Status',             idx: 28 },
  { key: 'idNo',         label: 'ID No',              idx: 30 },
  { key: 'idProfession', label: 'ID Profession',      idx: 31 },
  { key: 'idExpGreg',    label: 'ID Expiry',          idx: 33 },
  { key: 'idRemDays',    label: 'ID Remaining Days',  idx: 34 },
  { key: 'ppNumber',     label: 'Passport No',        idx: 35 },
  { key: 'ppExpiry',     label: 'Passport Expiry',    idx: 38 },
  { key: 'jobEnded',     label: 'Job Ended',          idx: 40 },
  { key: 'maritalStatus',label: 'Marital Status',     idx: 41 },
  { key: 'serviceEnded', label: 'Service Ended',      idx: 42 },
  { key: 'iban',         label: 'IBAN',               idx: 43 },
  { key: 'email',        label: 'Email',              idx: 44 },
];

// Fixed columns always shown (if match is one of these, no extra column added)
const DS_FIXED = [
  { label: 'Emp No',    idx: COL.empNum   },
  { label: 'Name',      idx: COL.name     },
  { label: 'Mobile',    idx: COL.mobile   },
  { label: 'Job Title', idx: COL.jobTitle },
];
const DS_FIXED_IDX = new Set(DS_FIXED.map(c => c.idx));

function deepSearch() {
  const query = document.getElementById('employeeNumber').value.trim().toLowerCase();
  if (!query) { alert('Type something in the search box first.'); return; }

  const doSearch = (rows) => {
    const header = rows[0] || [];

    // Match against all columns — exclude job-ended employees
    const results = [];
    rows.slice(1).forEach(r => {
      // Skip if job ended
      const jobEndedVal = (r[COL.jobEnded] || '').trim();
      if (jobEndedVal !== '' && jobEndedVal !== '—') return;

      const matchedCols = [];
      DS_ALL_COLS.forEach(col => {
        const cell = (r[col.idx] || '').toLowerCase();
        if (cell.includes(query)) matchedCols.push(col);
      });
      if (matchedCols.length > 0) results.push({ r, matchedCols });
    });

    if (results.length === 0) {
      document.getElementById('card-area').innerHTML =
        `<p style="text-align:center;color:#c0392b;padding:40px 0;font-size:15px;">No results found for "<strong>${query}</strong>".</p>`;
      return;
    }

    // Determine extra columns: matched columns NOT already in fixed set
    const extraColKeys = new Set();
    results.forEach(({ matchedCols }) => {
      matchedCols.forEach(col => {
        if (!DS_FIXED_IDX.has(col.idx)) extraColKeys.add(col.key);
      });
    });
    const extraCols = DS_ALL_COLS.filter(c => extraColKeys.has(c.key));

    // Build table
    let html = `<div class="ds-wrap">`;

    // Header: logo left + title
    html += `<div class="ds-header">
      <img src="nour_energy_logo.png" alt="Logo" onerror="this.style.display='none'">
      <span>Deep Search — "<em>${query}</em>" &nbsp;·&nbsp; ${results.length} record${results.length !== 1 ? 's' : ''} found</span>
    </div>`;

    // Table header
    html += `<table class="ds-tbl"><thead><tr>`;
    DS_FIXED.forEach(c => { html += `<th>${c.label}</th>`; });
    extraCols.forEach(c => { html += `<th>${c.label}</th>`; });
    html += `</tr></thead><tbody>`;

    // Rows
    results.forEach(({ r, matchedCols }) => {
      const matchedIdxSet = new Set(matchedCols.map(c => c.idx));
      html += `<tr onclick="loadCardByEmpNum('${(r[COL.empNum]||'').trim().replace(/'/g,"\\'")}')">`;
      DS_FIXED.forEach(c => {
        const val = v(r[c.idx]);
        const hi  = matchedIdxSet.has(c.idx) ? ' ds-match' : '';
        html += `<td class="${hi}">${c.idx === COL.name ? rtlWrap(val) : val}</td>`;
      });
      extraCols.forEach(c => {
        const val = v(r[c.idx]);
        const hi  = matchedIdxSet.has(c.idx) ? ' ds-match' : '';
        html += `<td class="${hi}">${val}</td>`;
      });
      html += `</tr>`;
    });

    html += `</tbody></table>`;

    // Footer same as card
    html += `<div class="card-footer">Printed: ${todayStr()}<br>Created by: Qasim</div>`;
    html += `</div>`;

    document.getElementById('card-area').innerHTML = html;
  };

  if (csvRows) {
    doSearch(csvRows);
  } else {
    fetch('Master File - Test copy.csv')
      .then(r => r.text())
      .then(csv => { csvRows = parseCSV(csv); doSearch(csvRows); })
      .catch(err => {
        document.getElementById('card-area').innerHTML =
          `<p style="text-align:center;color:#c0392b;padding:40px 0;">Failed to load data — ${err.message}</p>`;
      });
  }
}

/* ─── Load full card by clicking a Deep Search row ─── */
function loadCardByEmpNum(empNum) {
  if (!csvRows) return;
  const found = csvRows.slice(1).find(r => (r[COL.empNum]||'').trim() === empNum);
  if (found) {
    document.getElementById('card-area').innerHTML = renderCard(found, currentAccessLevel);
  }
}

/* ─── Clear Card ─── */
function clearCard() {
  document.getElementById('card-area').innerHTML = '';
  document.getElementById('employeeNumber').value = '';
  document.getElementById('employeeNumber').focus();
}

/* ─── Enter key ─── */
document.getElementById('pw-input').addEventListener('keyup', e => {
  if (e.key === 'Enter') checkPassword();
});
document.getElementById('employeeNumber').addEventListener('keyup', e => {
  if (e.key === 'Enter') searchEmployee();
});

/* ─── Helpers ─── */
function v(val) {
  if (!val || val.trim() === '' || val.trim() === 'N/A') return '—';
  return val.trim();
}

function rtlWrap(val) {
  // Wrap Arabic/RTL text
  if (/[\u0600-\u06FF]/.test(val)) return `<span dir="rtl">${val}</span>`;
  return val;
}

function parseDate(str) {
  if (!str || str.trim() === '' || str.trim() === '—') return null;
  const s = str.trim();
  // Try DD/MM/YYYY or YYYY-MM-DD
  let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1]);
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  const d = new Date(s);
  return isNaN(d) ? null : d;
}

function daysDiff(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}

function alertEmoji(days) {
  if (days === null) return null;
  if (days < 0)  return '🔴';
  if (days <= 30) return '🟠';
  if (days <= 90) return '🟡';
  return '🟢';
}

function fmtDate(str) { return v(str); }

function todayStr() {
  const d = new Date();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${String(d.getDate()).padStart(2,'0')}-${months[d.getMonth()]}-${d.getFullYear()}`;
}

/* ─── Parse CSV (handles quoted commas) ─── */
function parseCSV(text) {
  const lines = text.split('\n').filter(l => l.trim() !== '');
  return lines.map(line => {
    const cells = []; let cur = ''; let inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cells.push(cur); cur = ''; }
      else { cur += ch; }
    }
    cells.push(cur);
    return cells;
  });
}

/* ─── Render Card ─── */
function renderCard(cells, accessLevel) {
  const isAdmin = accessLevel === 'admin';
  const get = idx => (cells[idx] || '').trim();

  const name      = get(COL.name);
  const empNum    = get(COL.empNum);
  const jobEnded  = get(COL.jobEnded);
  const isEnded   = jobEnded !== '' && jobEnded !== '—';
  const service   = isEnded ? get(COL.serviceEnded) : get(COL.serviceCont);

  /* ── Header ── */
  let html = `<div class="card">`;
  html += `<div class="card-hdr">
    <img src="nour_energy_logo.png" alt="Logo" onerror="this.style.display='none'">
    <div class="card-hdr-text">
      <p class="emp-name">${rtlWrap(v(name))}${isEnded ? `<span class="job-ended-badge">JOB ENDED</span>` : ''}</p>
      <p class="emp-num">${v(empNum)}</p>
    </div>
  </div>`;

  /* ── Personal & Employment ── */
  html += `<div class="sec-hdr">Personal &amp; Employment</div>`;
  html += `<table class="dtbl"><colgroup><col class="lbl"><col class="val"><col class="lbl"><col class="val"></colgroup><tbody>`;

  function row2(l1, v1, l2, v2, opts={}) {
    const c1 = opts.red1 ? ' job-ended-cell' : '';
    const c2 = opts.red2 ? ' job-ended-cell' : '';
    return `<tr>
      <td class="lbl-cell">${l1}</td><td class="${c1}">${rtlWrap(v(v1))}</td>
      <td class="lbl-cell">${l2}</td><td class="${c2}">${rtlWrap(v(v2))}</td>
    </tr>`;
  }
  function row1(l1, v1, opts={}) {
    const c1 = opts.red1 ? ' job-ended-cell' : '';
    return `<tr>
      <td class="lbl-cell">${l1}</td><td colspan="3" class="${c1}">${rtlWrap(v(v1))}</td>
    </tr>`;
  }

  html += row2('Job Title', get(COL.jobTitle), 'Location', get(COL.location));
  html += row2('Nationality', get(COL.nationality), 'Mobile', get(COL.mobile));
  html += row2('Date of Birth', get(COL.dob), 'Age', get(COL.age));

  if (isEnded) {
    html += row2('Joining Date', get(COL.joiningDate), 'Job Ended', get(COL.jobEnded), {red2: true});
    html += row2('Contract', get(COL.contract), 'Total Service (Y,M,D)', service);
    html += row2('Annual Leave', get(COL.annualLeave), 'Tickets', get(COL.tickets));
    html += row2('Medical', get(COL.medical), 'Marital Status', get(COL.maritalStatus));
    html += row1('Email', get(COL.email));
    html += row1('IBAN', get(COL.iban));
  } else {
    html += row2('Joining Date', get(COL.joiningDate), 'Service', service);
    html += row2('Contract', get(COL.contract), 'Annual Leave', get(COL.annualLeave));
    html += row2('Tickets', get(COL.tickets), 'Medical', get(COL.medical));
    html += row2('Marital Status', get(COL.maritalStatus), 'Email', get(COL.email));
    html += row1('IBAN', get(COL.iban));
  }

  html += `</tbody></table>`;

  /* ── Salary (admin only) ── */
  if (isAdmin) {
    html += `<div class="sec-hdr">Salary (SAR)</div>`;
    html += `<table class="dtbl"><colgroup><col class="lbl"><col class="val"><col class="lbl"><col class="val"></colgroup><tbody>`;
    html += row2('Basic', get(COL.basic), 'Food', get(COL.food));
    html += row2('Other', get(COL.other), 'Housing 25%', get(COL.housing25));
    html += row2('Transport 10%', get(COL.trPct), 'Other Transport', get(COL.otherTrasp));
    html += `<tr class="salary-total-row">
      <td class="lbl-cell" style="color:#fff;background:#1e8449;">Total Salary</td>
      <td colspan="3" style="font-weight:700;font-size:15px;">${v(get(COL.total))} SAR</td>
    </tr>`;
    html += `</tbody></table>`;
  }

  /* ── IDs & Documents ── */
  html += `<div class="sec-hdr">IDs &amp; Documents</div>`;
  html += `<table class="dtbl"><colgroup><col class="lbl"><col class="val"><col class="lbl"><col class="val"></colgroup><tbody>`;
  html += row2('ID No', get(COL.idNo), 'ID Profession', get(COL.idProfession));
  html += row2('ID Exp (Gregorian)', get(COL.idExpGreg), 'ID Remaining Days', get(COL.idRemDays));
  html += row2('Qiwa Start', get(COL.qiwaStart), 'Qiwa Ending', get(COL.qiwaEnd));
  html += row2('Passport No', get(COL.ppNumber), 'PP Expiry', get(COL.ppExpiry));
  html += `</tbody></table>`;

  /* ── Alerts ── */
  html += `<div class="alerts-block">`;

  if (isEnded) {
    html += `<p style="color:#888;margin:0;">Employee left ${v(jobEnded)} — no document alerts generated.</p>`;
  } else {
    const checks = [
      { label: 'Iqama (ID)',   dateVal: get(COL.idExpGreg),  remDays: get(COL.idRemDays) },
      { label: 'Passport',     dateVal: get(COL.ppExpiry),   remDays: null },
      { label: 'Qiwa',         dateVal: get(COL.qiwaEnd),    remDays: null },
    ];

    let alertItems = [];
    let worstLevel = 0; // 0=clear,1=yellow,2=orange,3=red

    checks.forEach(ch => {
      let days;
      if (ch.remDays && ch.remDays !== '—' && !isNaN(+ch.remDays)) {
        days = +ch.remDays;
      } else {
        days = daysDiff(ch.dateVal);
      }
      const emoji = alertEmoji(days);
      if (!emoji || emoji === '🟢') {
        if (days !== null) worstLevel = Math.max(worstLevel, 0);
        return;
      }
      const level = emoji === '🔴' ? 3 : emoji === '🟠' ? 2 : 1;
      worstLevel = Math.max(worstLevel, level);
      const daysLabel = days === null ? '' : days < 0 ? ` (${Math.abs(days)}d overdue)` : ` (${days}d left)`;
      alertItems.push(`<div class="alert-item">${emoji} <strong>${ch.label}</strong> — ${fmtDate(ch.dateVal)}${daysLabel}</div>`);
    });

    if (alertItems.length === 0) {
      html += `<div class="alert-item">🟢 All documents checked — no immediate alerts.</div>`;
    } else {
      html += alertItems.join('');
    }

    const verdictClass = worstLevel >= 3 ? 'verdict-red' : worstLevel >= 2 ? 'verdict-yellow' : worstLevel >= 1 ? 'verdict-yellow' : 'verdict-green';
    const verdictText  = worstLevel >= 3 ? '🔴 Document Health: URGENT' : worstLevel >= 2 ? '🟠 Document Health: Attention' : worstLevel >= 1 ? '🟡 Document Health: Attention' : '🟢 Document Health: Clear';
    html += `<div class="verdict-line ${verdictClass}">${verdictText}</div>`;
  }

  html += `</div>`; // alerts-block

  /* ── Footer ── */
  html += `<div class="card-footer">
    Printed: ${todayStr()}<br>
    Created by: Qasim
  </div>`;

  html += `</div>`; // .card
  return html;
}

/* ─── Search Employee ─── */
function searchEmployee() {
  const query = document.getElementById('employeeNumber').value.trim();
  if (!query) { alert('Please enter an Employee Number or ID No.'); return; }

  document.getElementById('card-area').innerHTML = '<p style="text-align:center;color:#888;padding:40px 0;">Loading…</p>';

  const doSearch = (rows) => {
    let found = null;
    for (let i = 1; i < rows.length; i++) {
      const cells = rows[i];
      const empNum = (cells[COL.empNum] || '').trim();
      const idNo   = (cells[COL.idNo]   || '').trim();
      if (empNum === query || idNo === query) { found = cells; break; }
    }
    if (!found) {
      const nums = rows.slice(1).map(r => (r[COL.empNum]||'').trim()).filter(n => n);
      const close = nums
        .map(n => ({ n, diff: Math.abs(+n - +query) }))
        .sort((a,b) => a.diff - b.diff)
        .slice(0,3).map(x => x.n);
      document.getElementById('card-area').innerHTML =
        `<p style="text-align:center;color:#c0392b;padding:40px 0;font-size:15px;">
          Employee not found for "<strong>${query}</strong>".
          ${close.length ? `<br>Closest matches: <strong>${close.join(', ')}</strong>` : ''}
        </p>`;
      return;
    }
    document.getElementById('card-area').innerHTML = renderCard(found, currentAccessLevel);
  };

  if (csvRows) {
    doSearch(csvRows);
  } else {
    fetch('Master File - Test copy.csv')
      .then(r => r.text())
      .then(csv => { csvRows = parseCSV(csv); doSearch(csvRows); })
      .catch(err => {
        console.error(err);
        document.getElementById('card-area').innerHTML =
          `<p style="text-align:center;color:#c0392b;padding:40px 0;">Failed to load data — ${err.message}</p>`;
      });
  }

  document.getElementById('employeeNumber').value = '';
}


</script>
